info:
  title: Card Management
  version: 0.1.0-SNAPSHOT
  summary: "\n         |**This is for Postman - to have example requests. Be aware\
    \ the Output is not provided!**\n         |\n         |\n\nProcesses and Workers\
    \ related to Card Management.\n\nCreated at 11.08.2025, 15:04\n\n**See the [Orchescala\
    \ Documentation](https://pme123.github.io/orchescala/)**\n\n# Package Configuration\n\
    **Check all dependency trees here: [democompany-cards](../../dependencies/democompany-cards.html)**\n\
    \n### Dependencies:\n\n- _**[democompany-services](NOT_SET/democompany-services/OpenApi.html)**_\n\
    \n\n<details>\n<summary>PROJECT.conf</summary>\n<p>\n\n```\n\n// Project configuration\n\
    \nprojectName: democompany-cards\nprojectVersion: 0.1.0-SNAPSHOT\nsubProjects:\
    \ [\n  // subProject1\n  // subProject2\n]\ndependencies: [\n  democompany-services\n\
    ]\n\n```\n\n</p>\n</details>\n\n\nThere is no README.md in the Project.\n\n\n\
    <details>\n<summary><b><i>CHANGELOG.md</i></b></summary>\n<p>\n\n\nAll notable\
    \ changes to this project will be documented in this file.\n\n* Types of Changes\
    \ (L3):\n  * Added: new features\n  * Changed: changes in existing functionality\n\
    \  * Deprecated: soon-to-be-removed features\n  * Removed: now removed features\n\
    \  * Fixed: any bug fixes\n  * Security: in case of vulnerabilities\n\n\nThe format\
    \ is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),\nand this\
    \ project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n\
    \n\n</p>\n</details>\n\n\n<p/>\n<details>\n<summary>\n<b><i>General Variables</i></b>\n\
    </summary>\n\n<p>\n\n### Mocking\n\n**servicesMocked**:\n\nMock all the _ServiceWorkers_\
    \ in your process with their default Mock:\n\n- DSL:\n```scala\nprocess(..)\n\
    \  .mockServices\n```\n\n- Json\n```json\n...\n\"servicesMocked\": true,\n...\n\
    ```\n\n\n**mockedWorkers**:\n\nMock any Process- and/or ExternalTask-Worker with\
    \ their default Mocks.\nThis is a list of the _Worker topicNames or Process processNames_,\
    \ you want to mock.\nIt is also possible to use a _comma separated_ String,\n\
    like `\"mySubProcess,myOtherSubProcess,myService\"`\n\n_Be aware_: For Sub-Processes,\
    \ this expects an _InitWorker_ where the _topicName_ is equal to the _processName_.\n\
    \n\n- DSL:\n```scala\nprocess(..)\n  .mockedWorkers(\"mySubProcess1\", \"mySubProcess2\"\
    ) // creates a list with SubProcessess\n  .mockedWorker(\"myOtherSubProcess\"\
    ) // adds a SubProcess\n```\n\n- Json\n```json\n...\n\"mockedWorkers\": [\"mySubProcess\"\
    , \"myOtherSubProcess, myService\"],\n...\n```\n\n\n**outputMock**:\n\nMock the\
    \ Process or ExternalTask (`Out`)\n - You find an example in every _Process_ and\
    \ _ExternalTask_.\n\n\n- DSL:\n```scala\nprocess(..) // or serviceTask(..)/customTask(..)\n\
    \  .mockWith(outputMock)\n```\n\n- Json\n```json\n...\n\"outputMock\": {..},\n\
    ...\n```\n\n\n**outputServiceMock**:\n\nMock the Inner-Service (`MockedServiceResponse[ServiceOut]`)\n\
    \ - You find an example in every _ServiceTask_.\n\n\n- DSL:\n```scala\nserviceTask(..)\n\
    \  .mockServiceWith(MockedServiceResponse\n     .success200(inOut.defaultServiceOutMock))\n\
    ```\n\n- Json\n```json\n...\n\"outputServiceMock\": {\n  \"respStatus\" : 200,\n\
    \  \"respBody\" : \"Example String Body\",\n  \"respHeaders\" : [\n  ]\n},\n...\n\
    ```\n\n### Mapping\n**outputVariables**:\n\nYou can filter the Output with a list\
    \ of variable names you are interested in.\nThis list may include all variables\
    \ from the output (`Out`). We included an example for each Process or ExternalTask.\n\
    It is also possible to use a _comma separated_ String,\nlike `\"name,firstName\"\
    `\n\n\n- DSL:\n```scala\nprocess(..) // or serviceTask(..)/customTask(..)\n  .withOutputVariables(\"\
    name\", \"firstName\") // creates a list with outputVariables\n  .withOutputVariable(\"\
    nickname\") // adds a outputVariable\n```\n\n- Json\n```json\n...\n\"outputVariables\"\
    : [\"name\", \"firstName\"],\n...\n```\n\n\n**manualOutMapping**:\n\nBy default\
    \ all output Variables (`Out`) are on the Process for _External Tasks_.\nIf the\
    \ filter _outputVariables_ is not enough,\nyou can set this variable - every output\
    \ variable is then local.\n\n_Be aware_ that you must then manually have _output\
    \ mappings_ for each output variable!\n\n\n- DSL:\n```scala\nserviceTask(..) //\
    \ or customTask(..)\n  .manualOutMapping\n```\n\n- Json\n```json\n...\n\"manualOutMapping\"\
    : true,\n...\n```\n\n### Mocking\n**handledErrors**:\n\nA list of error codes\
    \ that are handled (`BpmnError`)\nIt is also possible to use a _comma separated_\
    \ String,\nlike `\"validation-failed,404\"`\n\nAt the moment only _ServiceTasks_\
    \ supported.\n\n\n- DSL:\n```scala\nserviceTask(..)\n  .handleErrors(ErrorCodes.`validation-failed`,\
    \ \"404\") // create a list of handledErrors\n  .handleError(\"404\") // add a\
    \ handledError\n```\n\n- Json\n```json\n...\n\"handledErrors\": [\"validation-failed\"\
    , \"404\"],\n...\n```\n\n\n**regexHandledErrors**:\n\nYou can further filter Handled\
    \ Errors with a list of Regex expressions that the body error message must match.\n\
    It is also possible to use a _comma separated_ String,\nlike `\"SQL exception,\"\
    errorNr\":\"20000\"\"`\n\nAt the moment only _ServiceTasks_ supported.\n\n\n-\
    \ DSL:\n```scala\nserviceTask(..)\n  .handleErrorWithRegex(\"SQL exception\")\n\
    \  .handleErrorWithRegex(\"\\\"errorNr\\\":\\\"20000\\\"\")\n```\n\n- Json\n```json\n\
    ...\n\"regexHandledErrors\": [\"SQL exception\", \"\"errorNr\":\"20000\"\"],\n\
    ...\n```\n\n### Authorization\n**impersonateUserId**:\n\nUser-ID of a User that\
    \ should be taken to authenticate to the services.\nThis must be supported by\
    \ your implementation. *Be caution: this may be a security issue!*.\nIt is helpful\
    \ if you have Tokens that expire, but long running Processes.\n\n- DSL:\n```scala\n\
    process(..) // or serviceTask(..)/customTask(..)\n  .withImpersonateUserId(impersonateUserId)\n\
    ```\n\n- Json\n```json\n...\n\"impersonateUserId\": \"myUserName\",\n...\n```\n\
    \n</p>\n</details>\n<p/>\n        \n\n> Created with:\n> - [orchescala-api v0.3.0-SNAPSHOT](https://github.com/pme123/orchescala)\n\
    > - democompany-orchescala-api 0.1.0-SNAPSHOT\n> - democompany-orchescala-helper\n\
    \n\n         |"
servers:
- url: http://localhost:8080/engine-rest
  description: Local Developer Server
paths:
  /process-definition/key/democompany-cards-orderCreditcardV1/start:
    post:
      tags:
      - democompany-cards-orderCreditcardV1
      summary: 'Bpmn: orderCreditcardV1'
      description: |2

        Demo Process to order a credit card.

        ---

        - **Called Element**: `democompany-cards-orderCreditcardV1` (to define in the Call Activity)



        ---




        See API Doc: [Bpmn: orderCreditcardV1](None/democompany-cards/OpenApi.html#operation/Bpmn:%20orderCreditcardV1)
      operationId: postProcess-definitionKeyDemocompany-cards-ordercreditcardv1Start
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartProcessIn'
            examples:
              democompany-cards-orderCreditcardV1:
                value:
                  variables:
                    clientId:
                      value: 1000
                      type: Long
                    creditCardAccount:
                      value: |-
                        {
                          "clientId" : 1213456,
                          "accountId" : 5555555
                        }
                      type: Json
                    mainCardHolder:
                      value: |-
                        {
                          "clientInformation" : {
                            "clientId" : 1213456,
                            "addressType" : "Domicile",
                            "residencePermitCode" : 2
                          },
                          "cards" : [
                            {
                              "categoryType" : "MainCard",
                              "cardLimit" : 10000.0,
                              "cardCurrency" : "CHF",
                              "embossedLineOne" : "PETER PAN"
                            }
                          ]
                        }
                      type: Json
                  businessKey: democompany-cards-orderCreditcardV1
                  withVariablesInReturn: true
        required: true
      responses:
        '200':
          description: ''
