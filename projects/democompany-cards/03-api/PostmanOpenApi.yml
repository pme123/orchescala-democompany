        See API Doc: [UserTask: CheckOrderTask](/democompany/democompany-cards/OpenApi.html#operation/UserTask:%20CheckOrderTask)
      operationId: postTask--remove:checkordertask--
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetActiveTaskIn'
            examples:
              CheckOrderTask:
                value:
                  processInstanceId: '{{processInstanceId}}'
                  active: true
        required: true
      responses:
        '200':
          description: ''
  /task/{taskId}/form-variables/--REMOVE:CheckOrderTask--:
    get:
      tags:
