  /process/democompany-customer-bookAppointmentV1/async:
    post:
      tags:
      - Book Appointment V1
      summary: Process start
      description: "\n\n\n---\n\n- **Called Element**: `democompany-customer-bookAppointmentV1`\
        \ (to define in the Call Activity)\n\n\n\n---\n\n\n\n\n- Input:  `democompany.customer.domain.bookAppointment.v1.BookAppointment\
        \ > In`\n- Output: `democompany.customer.domain.bookAppointment.v1.BookAppointment\
        \ > Out`\n\n\n\n\n<div class=\"diagramCanvas\">\n  <div class=\"diagram\"\
        \ id=\"customer-bookAppointmentV1-35703\">\n    <img onLoad=\"openFromUrl('customer-bookAppointmentV1.bpmn',\
        \ new BpmnJS({ container: $('#customer-bookAppointmentV1-35703'), height:\
        \ '95%', width: '95%' }));\" src=\"data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==\"\
        \ />\n  </div>\n</div>\n\nDownload: [customer-bookAppointmentV1.bpmn](diagrams/customer-bookAppointmentV1.bpmn)\n\
        \n\n<div>\n  <button onclick=\"downloadSVG('customer-bookAppointmentV1-35703')\"\
        >Download Diagram as SVG</button>\n</div>\n\n\n<details>\n<summary>\n<b><i>General\
        \ Variable(s)</i></b>\n</summary>\n\n<p>\n\n**outputVariables**:\n\nJust take\
        \ the variable you need in your process!\n```json\n...\n\"outputVariables\"\
        : \"reservationId,booked,customerStatus\",\n...\n```\n\n**outputMock**:\n\n\
        ```json\n...\n\"outputMock\": {\n  \"reservationId\" : \"anna.berater-2026-10-20T09:00\"\
        ,\n  \"booked\" : true,\n  \"customerStatus\" : \"customer\"\n},\n...\n```\n\
        \n</p>\n</details>\n</p>\n      \n\n\n**Used in no other Process.**\n\n**Uses\
        \ no other Processes.**\n<p/>\n<details>\n<summary><b><i>General Information</i></b></summary>\n\
        <p>\n\nThis describes the <b>Input</b> to start the Process with.\n\nBe aware\
        \ that running this request with Postman,\nyou will not get the <b>Output</b>\
        \ but the <i>processInstanceId</i>, as starting a process is asynchronous.\n\
        \nTo get the <b>Output</b> you need to use the `Process variables` request.\n\
        \n</p>\n</details>"
      operationId: Process start
      parameters:
      - name: tenantId
        in: query
        description: If you have a multi tenant setup, you must specify the Tenant
          ID.
        required: false
        schema:
          default: '{{tenantId}}'
          type: string
      - name: businessKey
        in: query
        description: Business Key, be aware that in Camunda 8 this is an additional
          process variable.
        required: false
        schema:
          default: From Test Client
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookAppointment.In'
            examples:
              democompany-customer-bookAppointmentV1:
                value:
                  reservationId: anna.berater-2026-10-20T09:00
                  token: 0b1c9a4e-7a43-4f0e-9d39-3a3f6c2d8e11
                  appointment:
                    advisorId: anna.berater
                    advisorName: Anna Berater
                    advisorEmail: anna.berater@democompany.ch
                    start: '2026-10-07T17:23:31.189311'
                    end: '2026-10-07T17:23:31.189335'
                    topic: advice
                    channel: branch
                  contact:
                    firstName: Peter
                    lastName: Muster
                    email: peter.muster@example.ch
                    phone: +41 79 123 45 67
                    customerNo: '100200'
                  remark: Bitte mit Parkplatz
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessInfo'
              example:
                processInstanceId: f150c3f1-13f5-11ec-936e-0242ac1d0007
                businessKey: ORDER-2025-12345
                status: Active
                engineType: C7
  /process/democompany-customer-bookAppointmentV1/{processInstanceId}/variables:
    get:
      tags:
      - Book Appointment V1
      summary: Process variables
      description: "\n\n\n---\n\n- **Called Element**: `democompany-customer-bookAppointmentV1`\
        \ (to define in the Call Activity)\n\n\n\n---\n\n\n\n\n- Input:  `democompany.customer.domain.bookAppointment.v1.BookAppointment\
        \ > In`\n- Output: `democompany.customer.domain.bookAppointment.v1.BookAppointment\
        \ > Out`\n\n\n\n\n\n<details>\n<summary>\n<b><i>General Variable(s)</i></b>\n\
        </summary>\n\n<p>\n\n**outputVariables**:\n\nJust take the variable you need\
        \ in your process!\n```json\n...\n\"outputVariables\": \"reservationId,booked,customerStatus\"\
        ,\n...\n```\n\n**outputMock**:\n\n```json\n...\n\"outputMock\": {\n  \"reservationId\"\
        \ : \"anna.berater-2026-10-20T09:00\",\n  \"booked\" : true,\n  \"customerStatus\"\
        \ : \"customer\"\n},\n...\n```\n\n</p>\n</details>\n</p>\n      <p/>\n<details>\n\
        <summary><b><i>General Information</i></b></summary>\n<p>\n\nThis describes\
        \ the <b>Output</b> of the Process you get. Be aware this does not check if\
        \ the process is finished (TODO).\n\n  \n</p>\n</details>"
      operationId: Process variables
      parameters:
      - name: processInstanceId
        in: path
        description: |+
          The processInstanceId of the Process.

          > This is the result id of the `StartProcess`. And should automatically be set in Postman - see _Postman Instructions_.

        required: true
        schema:
          default: '{{processInstanceId}}'
          type: string
      - name: variableFilter
        in: query
        description: A comma-separated String of variable names. E.g. `name,firstName`
        required: false
        schema:
          type: string
        example: reservationId,booked,customerStatus
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookAppointment.Out'
              examples:
                democompany-customer-bookAppointmentV1:
                  value:
                    reservationId: anna.berater-2026-10-20T09:00
                    booked: true
                    customerStatus: customer
  /worker/democompany-customer-bookAppointmentV1:
    post:
      tags:
      - Book Appointment V1
      summary: Init Worker
      description: |2

        <details>
        <summary><b>General Information</b></summary>

        The Init Worker has the following responsibilities:

          - Validates the Process Input (`In`). -> by Orchescala
          - Maps the Configuration to Process Variables (`InConfig`). -> by Orchescala
          - Custom validation the Process Input (`In`, e.g. combining 2 variables). -> Process Specific
          - Initializes the default Variables with `In` as input (see _Process_ description) and `InitIn` as output. -> Process Specific

        The Input is the same as the `In` object of the _Process_.

        `NoInput` means there is no initialization needed.
        </details>
      operationId: Init Worker
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookAppointment.In'
            examples:
              democompany-customer-bookAppointmentV1:
