  summary: "\n**This is for Postman - to have example requests. Be aware the Output\
    \ is not provided!**\n\n\n\nKatalog mit Beispielprozessen für die Orchescala-Patterns\
    \ - je Pattern ein Prozess mit Simulationen für Camunda 7 und Camunda 8.\n\nCreated\
    \ at 11/6/26, 6:35 AM\n\n**See the [Orchescala Documentation](https://pme123.github.io/orchescala/)**\n\
    \n<details>\n<summary><b><i>Postman Instructions</i></b></summary>\n<p>\nYou can\
    \ directly import this OpenApi YAML to [Postman](https://www.postman.com/):\n\
    **[OpenApi.yml](OpenApi.yml)**\n\nOnly thing you need to adjust is in the Collection.\n\
    - **Authorization**: `Bearer Token` with the `{{access_token}}` from the `GetToken`\
    \ request.\n- **Variables**: `tenantId`: `{{bank}}`\n- **Scripts - Pre-Request**:\n\
    \n```javascript\n// Refresh the OAuth token if necessary\nlet tokenDate = new\
    \ Date(2010, 1, 1);\nconst tokenTimestamp = pm.environment.get(\"OAuth_Timestamp\"\
    );\nif (tokenTimestamp) {\n  tokenDate = Date.parse(tokenTimestamp);\n}\nlet expiresInTime\
    \ = pm.environment.get(\"ExpiresInTime\");\nif (!expiresInTime) {\n  expiresInTime\
    \ = 300000; // Set default expiration time to 5 minutes\n}\nif (new Date() - tokenDate\
    \ >= expiresInTime) {\npm.sendRequest(\n{\n  url: `${pm.environment.get(\n   \
    \   \"tokenService\"\n    )}/auth/realms/${pm.environment.get(\n      \"bank\"\
    \n    )}/protocol/openid-connect/token`,\n  method: \"POST\",\n  header: {\n \
    \   \"Content-Type\": \"application/x-www-form-urlencoded\",\n  },\n  body: {\n\
    \    mode: \"urlencoded\",\n    urlencoded: [\n      { key: \"grant_type\", value:\
    \ \"password\" },\n      { key: \"client_id\", value: pm.environment.get(\"clientId\"\
    )},\n      { key: \"client_secret\", value: pm.environment.get(\"clientSecret\"\
    )},\n      { key: \"username\", value: pm.environment.get(\"username\")},\n  \
    \    { key: \"password\", value: pm.environment.get(\"pwd\") },\n      { key:\
    \ \"scope\", value: pm.environment.get(\"scope\") },\n    ],\n  },\n},\n  (_,\
    \ res) => {\n    pm.environment.set(\"access_token\", res.json().access_token);\n\
    \    pm.environment.set(\"OAuth_Timestamp\", new Date());\n    // Set the ExpiresInTime\
    \ variable to the time given in the response if it exists\n    if (res.json().expires_in)\
    \ {\n      expiresInTime = res.json().expires_in * 1000;\n    }\n    pm.environment.set(\"\
    ExpiresInTime\", expiresInTime);\n  });\n}\n  ```\n\n- **Scripts - Post-Response**:\n\
    \n```javascript\n  // Collection-level test script\n  pm.test(\"Auto-set variables\"\
    , function () {\n    const response = pm.response.json();\n\n    // Set processInstanceId\
    \ if present\n    if (response.processInstanceId) {\n        const id = response.processInstanceId;\n\
    \        pm.collectionVariables.set(\"processInstanceId\", id);\n        console.log(\"\
    Set processInstanceId: \" + id);\n    }\n\n    // Set taskId for array responses\n\
    \    if (pm.response.headers.get(\"userTaskId\")) {\n        const id = pm.response.headers.get(\"\
    userTaskId\")\n        pm.collectionVariables.set(\"userTaskInstanceId\", id);\n\
    \        console.log(\"userTaskInstanceId: \" + id)\n\n    }\n\n});\n  ```\n\n\
    </p>\n</details>\n\n\n\n\n# Package Configuration\n**Check all dependency trees\
    \ here: [democompany-patterns](../../dependencies/democompany-patterns.html)**\n\
    \n<details>\n<summary>PROJECT.conf</summary>\n<p>\n\n```\n\n// Project configuration\n\
    \nprojectName: democompany-patterns\nprojectVersion: 0.1.0-SNAPSHOT\nsubProjects:\
    \ [\n  // subProject1\n  // subProject2\n]\ndependencies: [\n  democompany-services\n\
    ]\n\n```\n\n</p>\n</details>\n\n\nKatalog mit Beispielprozessen für die **Orchescala-Patterns**\
    \ – kleine BPMN-Bausteine, die die\nOrch Spec in einen Prozess einfügt und wiedererkennt.\
    \ Je Pattern gibt es einen Beispielprozess\nfür Camunda 7 und Camunda 8 und eine\
    \ Simulation je Engine, die den Baustein auf einer echten Engine\ndurchspielt.\
    \ Später sollen die BPMN auch als Testdaten für die Orch Spec dienen.\n\nBis jetzt:\
    \ **«Init Process»**, **«Identität übernehmen / zurücksetzen»**,\n**«Mocks und\
    \ Identität weitergeben»**, **«Einmalige Ausführung»**, **«Prozess-Status am Ende»\
    **,\n**«Prozess mit Fehler stoppen»**, **«Prozess-Event senden»** und **«Abbruch\
    \ per Signal»**.\n\n## Init Process – `democompany-patterns-initProcessV1`\n\n\
    ```\nStart ─▶ [Init Process] ─▶ (succeeded)\n              │ output-mocked (Fehler-Boundary)\n\
    \              ▼\n         ⇨ output-mocked (Link-Wurf)\n\n⇨ output-mocked (Link-Ziel)\
    \ ─▶ (output-mocked)\n```\n\nDer erste Schritt des Prozesses ist ein Service-Task\
    \ mit der **Prozess-ID als Topic**. Den Task\nbearbeitet der InitWorker (`InitProcessWorker`):\n\
    \n- er **prüft das In** – ein leerer `customerName` ist ungültig (`validation-failed`),\n\
    - er **setzt die Vorgaben aus dem InConfig** – fehlt `inConfig` im In, steht danach\n\
    \  `inConfig = {\"greeting\": \"Grüezi\"}` im Prozess,\n- er setzt die Variablen\
    \ aus `customInit` (hier `greetingMessage = \"Grüezi Peter Muster\"`),\n- ist\
    \ der Prozess **gemockt** (`_mockedWorkers` enthält die Prozess-ID), liefert er\
    \ die gemockte\n  Ausgabe als Fehler `output-mocked`. Dieser ist in `_handledErrors\
    \ = output-mocked` freigegeben:\n  die Boundary springt über den Link `output-mocked`\
    \ zum Ende mit `processStatus = output-mocked`.\n\n Datei | Inhalt |\n---|---|\n\
    \ [`InitProcess.scala`](01-domain/src/main/scala/democompany/patterns/domain/initProcess/v1/InitProcess.scala)\
    \ | `In`, `InConfig`, `InitIn`, `Out` |\n [`InitProcessWorker.scala`](03-worker/src/main/scala/democompany/patterns/worker/initProcess/v1/InitProcessWorker.scala)\
    \ | InitWorker: Prüfung und `customInit` |\n [`camunda/patterns-initProcessV1.bpmn`](src/main/resources/camunda/patterns-initProcessV1.bpmn)\
    \ | Camunda 7 |\n [`camunda8/patterns-initProcessV1.bpmn`](src/main/resources/camunda8/patterns-initProcessV1.bpmn)\
    \ | Camunda 8 |\n [`InitProcessSimulation.scala`](03-simulation/src/test/scala/democompany/patterns/simulation/InitProcessSimulation.scala)\
    \ | die Szenarien, für beide Engines gleich |\n\nLayout und IDs des Pattern-Blocks\
    \ (`OutputMockedBoundary`, `OutputMockedThrow`,\n`OutputmockedEvent`, `OutputmockedEndEvent`,\
    \ `OutputMockedError`) stammen aus dem Pattern\n`init-process` der Orch Spec.\n\
    \n### Was in Camunda 8 anders ist\n\n Camunda 7 | Camunda 8 |\n---|---|---|\n\
    \ Topic | `camunda:type=\"external\" camunda:topic=\"<processId>\"` | `zeebe:taskDefinition\
    \ type=\"<processId>\"` |\n `_handledErrors` | `camunda:inputParameter` | `zeebe:input\
    \ source=\"=&quot;output-mocked&quot;\"` |\n `processStatus` am Ende | Execution\
    \ Listener (`execution.setVariable(...)`) | Output-Mapping (`zeebe:output`) |\n\
    \ `processInstanceId` | gibt es in der Engine (`execution.processInstanceId`)\
    \ | setzt der InitWorker als Variable (der `processInstanceKey`) – nur im normalen\
    \ Lauf, siehe unten |\n\nIn Camunda 8 landen die Variablen der gemockten Ausgabe\
    \ (der Fehler `output-mocked`) zuerst im\nScope der Boundary (dort steht `processStatus\
    \ = succeeded` aus dem gemockten `Out`); im Prozess\nsteht danach `processStatus\
    \ = output-mocked` aus dem Output-Mapping des Endes.\n\n## Simulationen\n\nDrei\
    \ Szenarien je Engine:\n\n1. **`InitProcess`** – normaler Lauf: endet mit `processStatus\
    \ = succeeded`, `inConfig` mit den Vorgaben.\n2. **`InitProcess mocked`** – Prozess-Output\
    \ gemockt: endet über den Pfad `output-mocked` mit\n   `processStatus = output-mocked`.\n\
    3. **`InitProcess invalid In`** – `customerName = \" \"`: der InitWorker meldet\n\
    \   `validation-failed: customerName must not be empty.` – nicht freigegeben,\
    \ also ein Incident.\n\nDie Simulation startet den Prozess **ohne Prüfung über\
    \ die Worker-App**\n(`config.validateProcess(false)`): sonst lehnt der Start ein\
    \ ungültiges In schon vor dem Prozess ab,\nund Szenario 3 käme nie zum InitWorker\
    \ in der Engine.\n\n### Engines\n\nBeide über die Firmen-Einstellung:\n\n- **Camunda\
    \ 7**: `CAMUNDA_BASE_URL` (Standard `http://localhost:8080/engine-rest`, Token\
    \ über `SSO_BASE_URL`).\n- **Camunda 8**: ein **lokales c8run ohne Anmeldung**\
    \ – `CAMUNDA_C8_GRPC_URL`\n  (Standard `http://localhost:26500`), `CAMUNDA_C8_REST_URL`\
    \ (Standard `http://localhost:8181`),\n  `CAMUNDA_C8_OPERATE_URL`.\n\nGateway\
    \ und Worker-Apps nutzen die Engines aus `COMPANY_ENGINES` (Standard `C7,C8,Op`).\n\
    \n### Starten\n\n1. Gateway der Firma starten – im Ordner `democompany-orchescala`\
    \ (Port 8887, ein anderer mit\n   `GATEWAY_PORT`):\n   ```bash\n   COMPANY_ENGINES=C7,C8\
    \ sbt gateway/run\n   ```\n2. Worker starten (C7 und C8 in einer App). `WORKER_APP_PORT`,\
    \ wenn 5555 schon belegt ist:\n   ```bash\n   COMPANY_ENGINES=C7,C8 WORKER_APP_PORT=5556\
    \ sbt \"worker/runMain democompany.patterns.worker.WorkerApp\"\n   ```\n3. Deployen\
    \ und simulieren in einem Schritt – über den Gateway:\n   ```bash\n   ./helper.scala\
    \ deploy InitProcessC7Simulation\n   ```\n   ```bash\n   ./helper.scala deploy\
    \ InitProcessC8Simulation\n   ```\n   Der Helper der Firma (`CompanyDeployHelper`)\
    \ macht `sbt publishLocal`, schickt das Manifest\n   `democompany:democompany-patterns:0.1.0-SNAPSHOT`\
    \ an `POST <GATEWAY_URL>/deployment?targetEngine=<C7|C8>`\n   (die Engine aus\
    \ dem Namen der Simulation; der Gateway liest die BPMN aus dem Jar in\n   `~/.ivy2/local`,\
    \ Ordner `camunda` bzw. `camunda8`) und startet danach die Simulation.\n   `GATEWAY_URL`\
    \ (Standard `http://localhost:8887`) für einen anderen Gateway; `GATEWAY_TOKEN`\
    \ ist nur\n   nötig, wenn der Gateway Tokens prüft (`TOKEN_ISSUER`).\n\n## Identitä\
    t übernehmen / zurücksetzen – `democompany-patterns-identityV1`\n\n```\nStart\
    \ ─▶ [Init Process] ─▶ [Antrag freigeben] ─▶ ◯ Identität übernehmen ─▶ [Identitä\
    t prüfen]\n      ─▶ [Antrag abschliessen] ─▶ ◯ Identität zurücksetzen ─▶ [Identitä\
    t prüfen] ─▶ (succeeded)\n```\n\nZwei getrennte Patterns – opt-in wie in C7: nur\
    \ wo das Pattern steht, wechselt die Identität.\n\nDas Gateway setzt `_identityCorrelation`\
    \ nur beim **Start**. Schliesst jemand eine Benutzeraufgabe ab\n(oder sendet eine\
    \ Nachricht mit `processInstanceId`), gibt es dessen signierte Identität als\n\
    **`_identityCorrelationOfActor`** mit – `_identityCorrelation` bleibt. Ob der\
    \ Prozess sie übernimmt,\nentscheidet das BPMN (siehe «Voraussetzung: Orchescala»\
    ).\n\n- **«Identität übernehmen»** – ein leeres Zwischenereignis direkt nach der\
    \ Benutzeraufgabe (oder dem\n  Empfang der Nachricht):\n  `_identityCorrelationBefore\
    \ = _identityCorrelation`, dann\n  `_identityCorrelation = _identityCorrelationOfActor`\
    \ (fehlt sie, bleibt die bisherige).\n- **«Identität zurücksetzen»** – ein leeres\
    \ Zwischenereignis, überall möglich:\n  `_identityCorrelation = _identityCorrelationBefore`.\n\
    \nDie Signatur bindet die Identität an die Prozessinstanz, nicht an den Namen\
    \ der Variable – nach dem\nKopieren prüfen die ServiceWorker sie wie bisher. Welche\
    \ Identität der Prozess gerade hat, zeigt\n**«Identität prüfen»**: ein CustomTask\
    \ nach dem Übernehmen und nach dem Zurücksetzen. Er hängt den\nBenutzernamen dieser\
    \ Identität an `checkedUsernames` an; das BPMN mappt ihn als Input\n`identityUsername`\
    \ (C7 `${_identityCorrelation.prop(\"username\").stringValue()}`, C8\n`=_identityCorrelation.username`).\
    \ Die Signatur prüft ein CustomWorker nicht – das tun nur\nServiceWorker (siehe\
    \ «Mocks und Identität weitergeben»). Ein CustomTask ist er, damit die Orch Spec\n\
    ihn als Worker des Prozesses mit seinem In/Out erkennt.\n\n Camunda 7 | Camunda\
    \ 8 |\n---|---|---|\n übernehmen | zwei Execution Listener (`start`) mit `execution.setVariable(...)`\
    \ und `execution.getVariableTyped(...)` | zwei Output-Mappings – **die Reihenfolge\
    \ zählt**: Zeebe wendet sie nacheinander an, also erst `_identityCorrelationBefore`\
    \ sichern, dann `_identityCorrelation` überschreiben (umgekehrt wäre «Before»\
    \ schon der Actor) |\n zurücksetzen | ein Execution Listener | ein Output-Mapping\
    \ |\n\n**C8:** fehlt eine Variable, liest FEEL `null` – ohne Identität gibt es\
    \ also keinen Incident, die Variablen stehen dann auf `null` (auf c8run 8.9 nachgeprü\
    ft, wie die Reihenfolge). Die Output-Mappings stehen auf dem leeren Zwischenereignis\
    \ – nicht auf der Benutzeraufgabe\n(mit einem Output-Mapping übernimmt Zeebe dort\
    \ sonst nur noch die gemappten Variablen).\n\n Datei | Inhalt |\n---|---|\n [`Identity.scala`](01-domain/src/main/scala/democompany/patterns/domain/identity/v1/Identity.scala)\
    \ | `In`, `Out` |\n [`ApproveRequestUT.scala`](01-domain/src/main/scala/democompany/patterns/domain/identity/v1/ApproveRequestUT.scala)\
    \ | «Antrag freigeben» – wer sie erledigt, wird übernommen |\n [`CheckIdentity.scala`](01-domain/src/main/scala/democompany/patterns/domain/identity/v1/CheckIdentity.scala)\
    \ | «Identität prüfen» – CustomTask: Benutzername der Identität des Prozesses\
    \ |\n [`CheckIdentityWorker.scala`](03-worker/src/main/scala/democompany/patterns/worker/identity/v1/CheckIdentityWorker.scala)\
    \ | der CustomWorker dazu |\n [`CloseRequestUT.scala`](01-domain/src/main/scala/democompany/patterns/domain/identity/v1/CloseRequestUT.scala)\
    \ | «Antrag abschliessen» – hier hat der Prozess die übernommene Identität |\n\
    \ [`IdentityWorker.scala`](03-worker/src/main/scala/democompany/patterns/worker/identity/v1/IdentityWorker.scala)\
    \ | InitWorker: Prüfung des In |\n [`camunda/patterns-identityV1.bpmn`](src/main/resources/camunda/patterns-identityV1.bpmn)\
    \ | Camunda 7 |\n [`camunda8/patterns-identityV1.bpmn`](src/main/resources/camunda8/patterns-identityV1.bpmn)\
    \ | Camunda 8 |\n [`IdentitySimulation.scala`](03-simulation/src/test/scala/democompany/patterns/simulation/IdentitySimulation.scala)\
    \ | die Szenarien, für beide Engines gleich |\n\n### Simulationen\n\n1. **`Identity\
    \ approved`** – gestartet als `admin`, «Antrag freigeben» erledigt als `actor`\n\
    \   (`.actingAs(testActorIdentityCorrelation)`), «Antrag abschliessen» wieder\
    \ als `admin`.\n   «Identität prüfen» sieht zuerst `actor` (übernommen), dann\
    \ `admin` (zurückgesetzt):\n   `checkedUsernames = [actor, admin]`. Am Ende gibt\
    \ es `_identityCorrelation`,\n   `_identityCorrelationBefore` und `_identityCorrelationOfActor`.\n\
    2. **`Identity mocked`** – endet über `output-mocked`, ohne Benutzeraufgabe.\n\
    3. **`Identity invalid In`** – `customerName = \" \"`: Incident `validation-failed`.\n\
    \n```bash\n./helper.scala deploy IdentityC7Simulation\n```\n```bash\n./helper.scala\
    \ deploy IdentityC8Simulation\n```\n\nMit Prüfungen wie `isEquals` oder `exists`\
    \ vergleicht die Simulation nur diese – nicht das `Out` von\n`example`. Ohne Zurü\
    cksetzen wäre `checkedUsernames = [actor, actor]` – das lässt das Szenario\nscheitern\
    \ (so geprüft).\n\nVor `actingAs` von Hand geprüft (C7 und C8): über ein lokales\
    \ Gateway gestartet als `starter`,\n«Antrag freigeben» erledigt als `approver`:\n\
    \n wann | `_identityCorrelation` |\n---|---|\n bei «Antrag freigeben» | `starter`\
    \ |\n bei «Antrag abschliessen» | `approver` (übernommen) |\n am Ende | `starter`\
    \ (zurückgesetzt) – `_identityCorrelationBefore = starter` |\n\n«Identität prü\
    fen» – damals noch ein ServiceWorker – hat dabei beide Male die Signatur des Gateways\n\
    akzeptiert (`approver`, dann `starter`).\n\n### Voraussetzung: Orchescala\n\n\
    `_identityCorrelationOfActor` setzt das Gateway ab pme123/orchescala#90 (in develop,\n\
    0.9.0-SNAPSHOT). Mit einem älteren\nGateway überschreibt der Abschluss einer Aufgabe\
    \ die Identität selbst: C8 immer, C7 nur mit\n`doOverrideImpersonation = true`.\n\
    \nDass `example.exists(...)` das Szenario nach dem `val` benennt (`Identity approved`),\
    \ braucht\nOrchescala ab pme123/orchescala#87 (in develop) – vorher hiess es `example`.\n\
    \n`actingAs` und die zweite Test-Identität `testActorIdentityCorrelation` gibt\
    \ es ab\npme123/orchescala#92 (in develop).\n\n## Mocks und Identität weitergeben\
    \ – `democompany-patterns-propagateMocksV1`\n\n```\nStart ─▶ [Init Process] ─▶\
    \ [Teilprozess aufrufen] ─▶ (succeeded)\n                                  │\n\
    \                                  ▼  democompany-patterns-propagateMocksSubV1\n\
    \                    Start ─▶ [Init Process] ─▶ [Kunde laden] ─▶ (succeeded)\n\
    ```\n\nEin Teilprozess (Call Activity) sieht nur die Variablen, die ihm der Aufruf\
    \ mitgibt. Damit Mocks\nund Identität auch dort gelten, gibt die Call Activity\
    \ diese drei weiter:\n\n- **`_servicesMocked`** – die Services im Teilprozess\
    \ sind gemockt,\n- **`_mockedWorkers`** – gemockte Worker, auch der InitWorker\
    \ des Teilprozesses (dessen Prozess-ID),\n- **`_identityCorrelation`** – die signierte\
    \ Identität des Starts.\n\nDazu das In (`customerName`, `clientId`); zurück kommen\
    \ `processStatus` des Teilprozesses als\n`subProcessStatus` und `client`.\n\n\
    **«Kunde laden»** zeigt, dass beides ankommt: der Service `GetClientsClientId`\
    \ aus\n**democompany-services** (Topic `democompany-services-clientsV1-GetClientsClientId`,\
    \ wie in\ndemocompany-cards). Seinen ServiceWorker führt die Worker-App dieses\
    \ Projekts mit\n(`dependencies(democompany.services.worker.WorkerApp)`, die Abhä\
    ngigkeit steht in `PROJECT.conf`).\nGemockt ist er nur, wenn `_servicesMocked`\
    \ im Teilprozess angekommen ist – und vorher prüft er die\nSignatur von `_identityCorrelation`.\
    \ Die Identität ist an die Prozessinstanz des **Starts**\ngebunden; im Teilprozess\
    \ akzeptiert der Worker sie, weil das die Root-Instanz seines Jobs ist.\n\nWeil\
    \ das Topic nicht mit der Prozess-ID beginnt, sieht die Orch Spec den Schritt\
    \ als Service aus dem\nKatalog – nicht als eigenen Worker des Prozesses.\n\n Camunda\
    \ 7 | Camunda 8 |\n---|---|---|\n Aufruf | `calledElement=\"<processId>\"` | `zeebe:calledElement\
    \ processId=\"<processId>\"` mit `propagateAllChildVariables=\"false\"` und `propagateAllParentVariables=\"\
    false\"` |\n hinein | `camunda:in source=… target=…` | `zeebe:input` |\n zurü\
    ck | `camunda:out source=… target=…` | `zeebe:output` |\n Root-Instanz des Jobs\
    \ | der Worker liest sie aus der History | kommt mit dem Job – über gRPC nicht,\
    \ dann fragt der Worker die Engine (siehe unten) |\n\n Datei | Inhalt |\n---|---|\n\
    \ [`PropagateMocks.scala`](01-domain/src/main/scala/democompany/patterns/domain/propagateMocks/v1/PropagateMocks.scala)\
    \ | `In`, `Out` des aufrufenden Prozesses |\n [`PropagateMocksSub.scala`](01-domain/src/main/scala/democompany/patterns/domain/propagateMocks/v1/PropagateMocksSub.scala)\
    \ | `In`, `Out` des Teilprozesses |\n [`PropagateMocksWorker.scala`](03-worker/src/main/scala/democompany/patterns/worker/propagateMocks/v1/PropagateMocksWorker.scala)\
    \ | InitWorker: Prüfung des In |\n [`PropagateMocksSubWorker.scala`](03-worker/src/main/scala/democompany/patterns/worker/propagateMocks/v1/PropagateMocksSubWorker.scala)\
    \ | InitWorker des Teilprozesses |\n [`camunda/patterns-propagateMocksV1.bpmn`](src/main/resources/camunda/patterns-propagateMocksV1.bpmn),\
    \ [`camunda/patterns-propagateMocksSubV1.bpmn`](src/main/resources/camunda/patterns-propagateMocksSubV1.bpmn)\
    \ | Camunda 7 |\n [`camunda8/patterns-propagateMocksV1.bpmn`](src/main/resources/camunda8/patterns-propagateMocksV1.bpmn),\
    \ [`camunda8/patterns-propagateMocksSubV1.bpmn`](src/main/resources/camunda8/patterns-propagateMocksSubV1.bpmn)\
    \ | Camunda 8 |\n [`PropagateMocksSimulation.scala`](03-simulation/src/test/scala/democompany/patterns/simulation/PropagateMocksSimulation.scala)\
    \ | die Szenarien, für beide Engines gleich |\n\n### Simulationen\n\n1. **`PropagateMocks\
    \ services mocked`** – `.mockServices`: «Kunde laden» ist im Teilprozess\n   gemockt\
    \ und akzeptiert die Identität des Starts; endet mit `subProcessStatus = succeeded`\
    \ und dem\n   Kunden aus dem Mock (`client`).\n2. **`PropagateMocks sub worker\
    \ mocked`** – zusätzlich `.mockWorker(PropagateMocksSub.processName)`:\n   der\
    \ Teilprozess endet über `output-mocked` (`subProcessStatus = output-mocked`),\
    \ der aufrufende\n   Prozess mit `processStatus = succeeded`.\n3. **`PropagateMocks\
    \ invalid In`** – `customerName = \" \"`: Incident `validation-failed`.\n\n```bash\n\
    ./helper.scala deploy PropagateMocksC7Simulation\n```\n```bash\n./helper.scala\
    \ deploy PropagateMocksC8Simulation\n```\n\n### Voraussetzung: Orchescala (C8)\n\
    \nÜber gRPC liefert der Camunda-Client 8.9 die Root-Instanz eines Jobs nicht mit\n\
    (`rootProcessInstanceKey` ist leer). Ohne sie lehnt der Worker im Teilprozess\
    \ die Identität des\nStarts ab («bound to process instance …, not to the job's\
    \ … (root: -)»). Ab pme123/orchescala#96\n(in develop, 0.9.0-SNAPSHOT) fragt der\
    \ C8-Worker die Root-Instanz dann bei der Engine nach\n(`GET /v2/process-instances/{key}`)\
    \ – erneut nur bei einem 404, solange ein eben gestarteter\nTeilprozess dort noch\
    \ fehlt. C7 braucht das nicht.\n\n## Einmalige Ausführung – `democompany-patterns-uniqueExecutionV1`\n\
    \n```\n✉ Start ─▶ [Init Process] ─▶ [Antrag bearbeiten] ─▶ (succeeded)\n\n┌ Prozess\
    \ läuft schon (Ereignis-Subprozess, nicht unterbrechend) ┐\n│  ✉ Start-Nachricht\
    \ nochmals ─▶ (läuft schon: alreadyRunning = true) │\n└───────────────────────\
    ─────────────────────────────────────────┘\n```\n\nDerselbe Prozess soll für denselben\
    \ Fall nur einmal laufen. Er startet deshalb über ein\n**Nachrichten-Startereignis**\
    \ (Name der Nachricht = Prozess-ID) mit einem **`businessKey`**. Solange\ner lä\
    uft, fängt ein nicht unterbrechender Ereignis-Subprozess **dieselbe Nachricht**:\
    \ ein zweiter\nStart mit demselben `businessKey` landet in der laufenden Instanz\
    \ (`alreadyRunning = true`) – eine\nzweite gibt es nicht.\n\n- Der InitWorker\
    \ setzt `alreadyRunning = false`; das Ende des Ereignis-Subprozesses setzt es\
    \ auf `true`.\n- Die Nachricht trägt das In mit – ein zweiter Start überschreibt\
    \ also dessen Variablen in der\n  laufenden Instanz.\n\n Camunda 7 | Camunda 8\
    \ |\n---|---|---|\n Start | `messageEventDefinition` – der `businessKey` ist der\
    \ der Instanz | ebenso – Orchescala setzt dazu die Variable `businessKey` |\n\
    \ Ereignis-Subprozess | fängt die Nachricht, weil C7 sie zuerst laufenden Instanzen\
    \ mit diesem `businessKey` zuordnet | die Nachricht hat `zeebe:subscription correlationKey=\"\
    =businessKey\"` – das Abo öffnet beim Start |\n `alreadyRunning = true` | Execution\
    \ Listener (`start`) am Ende | Output-Mapping am Ende |\n zweiter Start über Orchescala\
    \ | wird abgelehnt (409: «correlated to a running process instance») | ebenso\
    \ – Orchescala schickt den `businessKey` als Korrelationsschlüssel mit (siehe\
    \ unten) |\n\n Datei | Inhalt |\n---|---|\n [`UniqueExecution.scala`](01-domain/src/main/scala/democompany/patterns/domain/uniqueExecution/v1/UniqueExecution.scala)\
    \ | `In`, `InitIn` (`alreadyRunning`), `Out` |\n [`EditRequestUT.scala`](01-domain/src/main/scala/democompany/patterns/domain/uniqueExecution/v1/EditRequestUT.scala)\
    \ | «Antrag bearbeiten» – solange sie offen ist, läuft der Prozess |\n [`StartAgainME.scala`](01-domain/src/main/scala/democompany/patterns/domain/uniqueExecution/v1/StartAgainME.scala)\
    \ | die Start-Nachricht ein zweites Mal |\n [`UniqueExecutionWorker.scala`](03-worker/src/main/scala/democompany/patterns/worker/uniqueExecution/v1/UniqueExecutionWorker.scala)\
    \ | InitWorker: Prüfung des In, `alreadyRunning = false` |\n [`camunda/patterns-uniqueExecutionV1.bpmn`](src/main/resources/camunda/patterns-uniqueExecutionV1.bpmn)\
    \ | Camunda 7 |\n [`camunda8/patterns-uniqueExecutionV1.bpmn`](src/main/resources/camunda8/patterns-uniqueExecutionV1.bpmn)\
    \ | Camunda 8 |\n [`UniqueExecutionSimulation.scala`](03-simulation/src/test/scala/democompany/patterns/simulation/UniqueExecutionSimulation.scala)\
    \ | die Szenarien, für beide Engines gleich |\n\n### Simulationen\n\nBeide Szenarien\
    \ starten mit der Nachricht (`.startWithMsg`); der `businessKey` ist der Name\
    \ des\nSzenarios. Ein Szenario mit ungültigem In gibt es hier nicht (das prüft\
    \ die Simulation von «Init\nProcess»): Seine Instanz bliebe mit dem Incident stehen,\
    \ und die Nachricht des nächsten Laufs\n(gleicher `businessKey`) käme dann in\
    \ ihr an – genau das, was das Pattern tut (409). Direkt starten\nlässt sich der\
    \ Prozess in C8 nicht, er hat dort nur den Nachrichten-Start.\n\n1. **`UniqueExecution\
    \ started`** – einmal gestartet, «Antrag bearbeiten» erledigt: endet mit\n   `alreadyRunning\
    \ = false`.\n2. **`UniqueExecution started twice`** – während «Antrag bearbeiten»\
    \ offen ist, kommt die\n   Start-Nachricht mit demselben `businessKey` nochmals\
    \ (`StartAgainME.withBusinessKey(...)`): der\n   Ereignis-Subprozess fängt sie,\
    \ der Prozess endet mit `alreadyRunning = true`. Die Nachricht wartet,\n   bis\
    \ der InitWorker `alreadyRunning = false` gesetzt hat (`.waitFor(\"alreadyRunning\"\
    , false)`) –\n   sonst überschreibt er das `true`.\n\n```bash\n./helper.scala\
    \ deploy UniqueExecutionC7Simulation\n```\n```bash\n./helper.scala deploy UniqueExecutionC8Simulation\n\
    ```\n\nBleibt eine Instanz eines Szenarios stehen (ein abgebrochener Lauf, ein\
    \ zweiter Worker, der den Job\nhält), lehnt der nächste Lauf dessen Start mit\
    \ 409 ab – das Pattern wirkt. Dann die Instanz in\nCockpit bzw. Operate abbrechen.\n\
    \n### Voraussetzung: Orchescala (C8)\n\nAb Orchescala 0.9.0 ([pme123/orchescala#98](https://github.com/pme123/orchescala/pull/98))\
    \ schickt der Start über Orchescala (`POST /process/{messageName}/message?businessKey=…\
    `,\n`C8ProcessInstanceService.startProcessByMessage`) den `businessKey` als Korrelationsschlü\
    ssel mit:\n\n- **Mit dem Pattern** landet ein zweiter Start in der laufenden Instanz\
    \ – Orchescala antwortet wie in\n  C7 mit 409 und setzt dort keine Identität.\n\
    - **Ohne das Pattern** startet ein zweiter Start weiter eine neue Instanz, wie\
    \ bisher und wie in C7:\n  Zeebe lässt pro Korrelationsschlüssel nur eine laufende\
    \ Instanz eines Nachrichten-Starts zu – lehnt\n  es ab, schickt Orchescala die\
    \ Nachricht nochmals ohne Schlüssel.\n\nOb die Nachricht eine neue Instanz gestartet\
    \ hat, sieht Orchescala am Key: eine neue ist jünger als\ndie Nachricht (auf ihrer\
    \ Partition), eine laufende älter. Auf c8run 8.9.21 nachgeprüft.\n\nVorher schickte\
    \ der C8-Start keinen Schlüssel mit – dann passte das Abo des Ereignis-Subprozesses\n\
    nicht, und jeder Start legte eine neue Instanz an.\n\n## Prozess-Status am Ende\
    \ – `democompany-patterns-processStatusV1`\n\n```\nStart ─▶ [Init Process] ─▶\
    \ ◇ Antrag bewilligt? ─ ja ──▶ (succeeded)\n                                 \
    \ └─ nein ─▶ (canceled)\n```\n\nJedes Ende setzt **`processStatus`** – so sieht\
    \ der Aufrufer (und die Simulation), wie der Prozess\nausgegangen ist. Den Wert\
    \ gibt man beim Einfügen als Parameter `processStatus` an (Vorgabe\n`succeeded`);\
    \ er ist Text, kein Ausdruck. Ein Status von Orchescala (`ProcessStatus`: `succeeded`,\n\
    `canceled`, `failed`, `notValid`, `output-mocked`) wird im `Out` ein fester Fall.\n\
    \nHier entscheidet ein Gateway über `approved` aus dem In: bewilligt endet der\
    \ Prozess mit\n`succeeded`, sonst mit `canceled`.\n\n Camunda 7 | Camunda 8 |\n\
    ---|---|---|\n `processStatus` am Ende | Execution Listener (`start`): `execution.setVariable(\"\
    processStatus\", \"…\")` | Output-Mapping `zeebe:output source=\"=&quot;…&quot;\"\
    \ target=\"processStatus\"` |\n\nDie anderen Beispielprozesse tragen das Pattern\
    \ an ihrem Ende `succeeded` schon. Das Ende\n`output-mocked` setzt `processStatus`\
    \ auch – es gehört aber zu «Init Process», nicht zu diesem\nPattern: die Orch\
    \ Spec erkennt dort nur «Init Process».\n\n Datei | Inhalt |\n---|---|\n [`ProcessStatusExample.scala`](01-domain/src/main/scala/democompany/patterns/domain/processStatus/v1/ProcessStatusExample.scala)\
    \ | `In` (`approved`), `Out` |\n [`ProcessStatusExampleWorker.scala`](03-worker/src/main/scala/democompany/patterns/worker/processStatus/v1/ProcessStatusExampleWorker.scala)\
    \ | InitWorker: Prüfung des In |\n [`camunda/patterns-processStatusV1.bpmn`](src/main/resources/camunda/patterns-processStatusV1.bpmn)\
    \ | Camunda 7 |\n [`camunda8/patterns-processStatusV1.bpmn`](src/main/resources/camunda8/patterns-processStatusV1.bpmn)\
    \ | Camunda 8 |\n [`ProcessStatusSimulation.scala`](03-simulation/src/test/scala/democompany/patterns/simulation/ProcessStatusSimulation.scala)\
    \ | die Szenarien, für beide Engines gleich |\n\nDas Objekt heisst `ProcessStatusExample`,\
    \ nicht `ProcessStatus` – sonst verdeckte es den Typ\n`ProcessStatus` von Orchescala.\n\
    \n### Simulationen\n\n1. **`ProcessStatus succeeded`** – `approved = true`: endet\
    \ mit `processStatus = succeeded`.\n2. **`ProcessStatus canceled`** – `approved\
    \ = false`: endet mit `processStatus = canceled`.\n3. **`ProcessStatus mocked`**\
    \ – endet über den Pfad `output-mocked` von «Init Process».\n\nEin Szenario mit\
    \ ungültigem In gibt es hier nicht – das prüft die Simulation von «Init Process»\
    .\n\n```bash\n./helper.scala deploy ProcessStatusC7Simulation\n```\n```bash\n\
    ./helper.scala deploy ProcessStatusC8Simulation\n```\n\n## Prozess mit Fehler\
    \ stoppen – `democompany-patterns-stopWithErrorV1`\n\n```\n                  \
    \                                    ┌─ ja ──▶ ○ Limit überschritten ⚡ Incident\
    \ ─┐\nStart ─▶ [Init Process] ─▶ ◇ Kunde gesperrt? ─ nein ─▶ ◇ Limit überschritten?\
    \ ─ nein ─────────────▶ (succeeded)\n                                  └─ ja ─\
    ─▶ (Kunde gesperrt) ⚡ Incident\n```\n\nDas Pattern **unterbricht den Prozess mit\
    \ einem Fehler, den DevOps im Cockpit (C7) bzw. in Operate (C8)\nbehandeln**:\
    \ der Prozess bleibt sofort mit einem **Incident** stehen, dessen Meldung das\
    \ Problem\nbeschreibt. Das Ereignis ist **orange** – ohne Blitz: ein Fehler-Endereignis\
    \ würfe in C8 den BPMN-Fehler,\nohne die Mappings auszuwerten (der Incident hiesse\
    \ dann nur «… not caught»), und ein Aufrufer könnte ihn\nfangen. Es passt an ein\
    \ End-Ereignis oder an ein werfendes Zwischenereignis; die Meldung\n(`message`)\
    \ ist Text oder FEEL – hier `= \"Kunde \" + customerName + \" ist gesperrt.\"\
    ` am Ende und\n`= \"Limit von \" + customerName + \" überschritten.\"` am Zwischenereignis.\n\
    \n**Ende oder Zwischenereignis:** am Ende ist der Prozess fertig, wenn DevOps\
    \ ihn behandelt haben (meist\nabbrechen). Am Zwischenereignis kann er weiterlaufen:\
    \ nachdem die Ursache behoben ist, schieben DevOps\ndie Instanz per Modification\
    \ hinter das Ereignis – hier geht sie dann zu `succeeded`.\n\n**Behandeln:** ein\
    \ Retry wirft denselben Fehler wieder – der Incident ist kein vorübergehender\n\
    Fehler, sondern eine Stelle, an der jemand entscheiden muss. DevOps brechen die\
    \ Instanz ab oder schieben\nsie per Process Instance Modification weiter (C7:\
    \ Cockpit, C8: Operate), nachdem die Ursache behoben ist.\n\n Camunda 7 | Camunda\
    \ 8 |\n---|---|---|\n Meldung | `camunda:inputParameter _errorMessage` – FEEL\
    \ wird JUEL (`${\"Kunde \".concat(customerName)…}`) | Output-Mapping `_errorMessage`\
    \ |\n stoppen | Groovy-Listener (`end`): `throw new IllegalArgumentException(…\
    )`; `asyncBefore`, damit der Incident am Ereignis entsteht, und `failedJobRetryTimeCycle`\
    \ `R1/PT0S` – ein Versuch | Output-Mapping `_stopped = assert(false, false, string(_errorMessage))`\
    \ |\n Incident | Meldung der Exception | `IO_MAPPING_ERROR` – «Assertion failure\
    \ …: Kunde Peter Muster ist gesperrt.» |\n\n**C7:** die Exception kommt im Job\
    \ von `asyncBefore`. `failedJobRetryTimeCycle` `R1/PT0S` lässt ihn nur\neinmal\
    \ laufen – der Incident entsteht sofort, gleich wie die Engine Retries sonst einstellt.\n\
    `asyncBefore` ist eine Transaktionsgrenze am Ereignis.\n\n**C8:** Zeebe fasst\
    \ die Output-Mappings zu einem FEEL-Kontext zusammen (`{_errorMessage: …, _stopped:\n\
    …}`) – ein späterer Eintrag sieht die früheren. Ein Ziel zweimal gäbe es darin\
    \ nur einmal; deshalb\nsteht `assert` unter einem eigenen Namen. `assert` ist\
    \ auf c8run 8.9 nachgeprüft. Wird der Incident\naufgelöst, wertet Zeebe das Mapping\
    \ neu aus – der Prozess bleibt stehen, wie in C7. Fester Text mit\n`\"` geht als\
    \ C8-Meldung nicht (er stünde in einer FEEL-Zeichenkette) – dann als FEEL schreiben.\n\
    \n Datei | Inhalt |\n---|---|\n [`StopWithError.scala`](01-domain/src/main/scala/democompany/patterns/domain/stopWithError/v1/StopWithError.scala)\
    \ | `In` (`blocked`, `limitExceeded`), `Out` |\n [`StopWithErrorWorker.scala`](03-worker/src/main/scala/democompany/patterns/worker/stopWithError/v1/StopWithErrorWorker.scala)\
    \ | InitWorker: Prüfung des In |\n [`camunda/patterns-stopWithErrorV1.bpmn`](src/main/resources/camunda/patterns-stopWithErrorV1.bpmn)\
    \ | Camunda 7 |\n [`camunda8/patterns-stopWithErrorV1.bpmn`](src/main/resources/camunda8/patterns-stopWithErrorV1.bpmn)\
    \ | Camunda 8 |\n [`StopWithErrorSimulation.scala`](03-simulation/src/test/scala/democompany/patterns/simulation/StopWithErrorSimulation.scala)\
    \ | die Szenarien, für beide Engines gleich |\n\n### Simulationen\n\n1. **`StopWithError\
    \ succeeded`** – `blocked = false`: endet mit `processStatus = succeeded`.\n2.\
    \ **`StopWithError blocked`** – `blocked = true`: Incident am Ende mit «Kunde\
    \ Peter Muster ist\n   gesperrt.» (`incidentScenario`).\n3. **`StopWithError limit\
    \ exceeded`** – `limitExceeded = true`: Incident am Zwischenereignis mit «Limit\n\
    \   von Peter Muster überschritten.».\n4. **`StopWithError mocked`** – endet ü\
    ber den Pfad `output-mocked` von «Init Process».\n\n```bash\n./helper.scala deploy\
    \ StopWithErrorC7Simulation\n```\n```bash\n./helper.scala deploy StopWithErrorC8Simulation\n\
    ```\n\nBleiben die Instanzen der Szenarien 2 und 3 stehen, ist das gewollt – in\
    \ Cockpit bzw. Operate abbrechen\noder (Szenario 3) per Modification weiterschieben.\n\
    \n## Prozess-Event senden – `democompany-patterns-sendProcessEventV1`\n\n```\n\
    Start ─▶ [Init Process] ─▶ [Prozess-Event: gestartet] ─▶ [Prozess-Event: beendet]\
    \ ─▶ (succeeded)\n                                  │ ruft                   \
    \     │ ruft\n                                  ▼                            \
    \ ▼\n                     democompany-patterns-processEventV1:  (Event) ─▶ (entgegengenommen)\n\
    ```\n\nDas Pattern **meldet einen Schritt des Prozesses an einen eigenen Event-Prozess**\
    \ – hier zu Beginn\n`started` und am Ende `finished`. Es sitzt an einer **Call\
    \ Activity**; welchen Prozess sie ruft, wählt\nman im Pattern (`eventProcess`,\
    \ Auswahl aus den Prozessen des Katalogs – ohne Wahl zeigt die Orch Spec\neinen\
    \ Hinweis). Der Event-Prozess bekommt:\n\n Eingabe | Inhalt |\n---|---|\n `eventKey`\
    \ | was passiert ist – Parameter `eventKey`, Text oder FEEL (Vorgabe `started`)\
    \ |\n `processDefinitionKey` | die ID des meldenden Prozesses |\n `processInstanceId`\
    \ | seine Instanz |\n\nZurück gibt er nichts. Was er mit dem Event macht – einem\
    \ Fremdsystem melden, protokollieren – ist seine\nSache; hier ist es ein **Dummy**\
    \ (`democompany-patterns-processEventV1`), der das Event entgegennimmt\nund mit\
    \ `succeeded` endet. Die Eingaben sieht man in Cockpit bzw. Operate an seiner\
    \ Instanz.\n\n Camunda 7 | Camunda 8 |\n---|---|---|\n gerufener Prozess | `calledElement`\
    \ | `zeebe:calledElement processId`, `propagateAllParentVariables` und `propagateAllChildVariables`\
    \ aus |\n Prozess-ID | `${execution.getProcessDefinition().getKey()}` | die ID\
    \ als Text (`=\"democompany-patterns-sendProcessEventV1\"`) |\n Instanz | `${execution.getProcessInstanceId()}`\
    \ | `=processInstanceId` – setzt der InitWorker, der Prozess braucht «Init Process»\
    \ |\n\nSollen Mocks und Identität auch im Event-Prozess gelten, trägt dieselbe\
    \ Call Activity zusätzlich\n«Mocks und Identität weitergeben» – die Orch Spec\
    \ erkennt beide.\n\n Datei | Inhalt |\n---|---|\n [`SendProcessEvent.scala`](01-domain/src/main/scala/democompany/patterns/domain/sendProcessEvent/v1/SendProcessEvent.scala)\
    \ | `In`, `Out` |\n [`ProcessEvent.scala`](01-domain/src/main/scala/democompany/patterns/domain/processEvent/v1/ProcessEvent.scala)\
    \ | der Dummy: `In` (`eventKey`, `processDefinitionKey`, `processInstanceId`),\
    \ `Out` |\n [`SendProcessEventWorker.scala`](03-worker/src/main/scala/democompany/patterns/worker/sendProcessEvent/v1/SendProcessEventWorker.scala)\
    \ | InitWorker: Prüfung des In |\n [`camunda/patterns-sendProcessEventV1.bpmn`](src/main/resources/camunda/patterns-sendProcessEventV1.bpmn),\
    \ [`camunda/patterns-processEventV1.bpmn`](src/main/resources/camunda/patterns-processEventV1.bpmn)\
    \ | Camunda 7 |\n [`camunda8/patterns-sendProcessEventV1.bpmn`](src/main/resources/camunda8/patterns-sendProcessEventV1.bpmn),\
    \ [`camunda8/patterns-processEventV1.bpmn`](src/main/resources/camunda8/patterns-processEventV1.bpmn)\
    \ | Camunda 8 |\n [`SendProcessEventSimulation.scala`](03-simulation/src/test/scala/democompany/patterns/simulation/SendProcessEventSimulation.scala)\
    \ | die Szenarien, für beide Engines gleich |\n\n### Simulationen\n\n1. **`SendProcessEvent\
    \ succeeded`** – meldet `started` und `finished` und endet mit\n   `processStatus\
    \ = succeeded`. Fehlte der Event-Prozess, bliebe der Prozess mit einem Incident\
    \ an der\n   Call Activity stehen.\n2. **`SendProcessEvent mocked`** – endet ü\
    ber den Pfad `output-mocked` von «Init Process», ohne Event.\n3. **`ProcessEvent\
    \ dummy`** – der Dummy für sich: nimmt das Event entgegen und endet mit `succeeded`.\n\
    \n```bash\n./helper.scala deploy SendProcessEventC7Simulation\n```\n```bash\n\
    ./helper.scala deploy SendProcessEventC8Simulation\n```\n\n## Abbruch per Signal\
    \ – `democompany-patterns-cancelBySignalV1`\n\n```\nStart ─▶ [Init Process] ─▶\
    \ [Antrag bearbeiten] ─▶ (succeeded)\n\n┌ Abbruch (Ereignis-Subprozess, unterbrechend)\
    \ ──────────┐\n│ (Signal cancel-<Instanz>) ─▶ (canceled)                 │\n└─\
    ────────────────────────────────────────────────────────┘\n```\n\nDas Pattern\
    \ **bricht eine Instanz von aussen ab**: ein unterbrechender Ereignis-Subprozess\
    \ wartet auf das\nSignal `cancel-<Instanz>`. Kommt es, beendet er den Prozess\
    \ – egal, wo er gerade wartet – und setzt\n`processStatus = canceled`. Ohne Signal\
    \ wird «Antrag bearbeiten» erledigt, und der Prozess endet mit\n`succeeded`. Das\
    \ Pattern sitzt am **Prozess**; das Präfix des Signals ist ein Parameter\n(`signalPrefix`,\
    \ Vorgabe `cancel-`).\n\nDas Signal ist an **diese eine Instanz** gebunden – sein\
    \ Name wird beim Start der Instanz gebildet:\n\n Camunda 7 | Camunda 8 (ab 8.10)\
    \ |\n---|---|---|\n Signalname | `cancel-${execution.processInstanceId}` | `=\"\
    cancel-\" + string(camunda.processInstance.key)` |\n Status | Listener am Ende\
    \ `canceled` | Output-Mapping am Ende `canceled` |\n\nSenden lässt es sich über\
    \ Orchescala mit dem Platzhalter `{processInstanceId}` im Namen\n(`cancel-{processInstanceId}`,\
    \ siehe [`CancelSE.scala`](01-domain/src/main/scala/democompany/patterns/domain/cancelBySignal/v1/CancelSE.scala)),\n\
    oder aus einem anderen Element des Prozesses mit einem Signal-Ende bzw. -Zwischenereignis\
    \ desselben Namens.\n\n**Camunda 8 braucht 8.10.** Erst ab 8.10 kennt FEEL `camunda.processInstance.key`.\
    \ Eine Variable wie\n`processInstanceId` gibt es beim Start noch nicht (sie setzt\
    \ erst der InitWorker) – auf 8.9 bleibt jede\nInstanz deshalb schon beim Start\
    \ mit einem Incident stehen\n(«Expected result of the expression … to be 'STRING',\
    \ but was 'NULL'»; auf c8run 8.9.21 nachgeprüft).\nDie Simulationen für C8 laufen\
    \ auf c8run 8.10.8.\n\n Datei | Inhalt |\n---|---|\n [`CancelBySignal.scala`](01-domain/src/main/scala/democompany/patterns/domain/cancelBySignal/v1/CancelBySignal.scala)\
    \ | `In`, `InitIn` (`waitForSignal`), `Out` |\n [`EditRequestUT.scala`](01-domain/src/main/scala/democompany/patterns/domain/cancelBySignal/v1/EditRequestUT.scala)\
    \ | «Antrag bearbeiten» – hier wartet der Prozess |\n [`CancelSE.scala`](01-domain/src/main/scala/democompany/patterns/domain/cancelBySignal/v1/CancelSE.scala)\
    \ | das Signal `cancel-{processInstanceId}` |\n [`CancelBySignalWorker.scala`](03-worker/src/main/scala/democompany/patterns/worker/cancelBySignal/v1/CancelBySignalWorker.scala)\
    \ | InitWorker: Prüfung des In, `waitForSignal = true` |\n [`camunda/patterns-cancelBySignalV1.bpmn`](src/main/resources/camunda/patterns-cancelBySignalV1.bpmn)\
    \ | Camunda 7 |\n [`camunda8/patterns-cancelBySignalV1.bpmn`](src/main/resources/camunda8/patterns-cancelBySignalV1.bpmn)\
    \ | Camunda 8 (ab 8.10) |\n [`CancelBySignalSimulation.scala`](03-simulation/src/test/scala/democompany/patterns/simulation/CancelBySignalSimulation.scala)\
    \ | die Szenarien, für beide Engines gleich |\n\n### Simulationen\n\n1. **`CancelBySignal\
    \ succeeded`** – kein Signal: «Antrag bearbeiten» wird erledigt, der Prozess endet\
    \ mit\n   `processStatus = succeeded`.\n2. **`CancelBySignal canceled`** – das\
    \ Signal kommt, während der Prozess an «Antrag bearbeiten» wartet:\n   der Ereignis-Subprozess\
    \ bricht ab, der Prozess endet mit `processStatus = canceled`. Die Simulation\n\
    \   schickt das Signal erst, wenn der InitWorker durch ist (`waitForSignal = true`).\n\
    3. **`CancelBySignal mocked`** – endet über den Pfad `output-mocked` von «Init\
    \ Process».\n\nWie die anderen Pattern-Simulationen startet sie ohne Prüfung ü\
    ber die Worker-App\n(`validateProcess(false)`) – das In prüft der InitWorker in\
    \ der Engine.\n\n```bash\n./helper.scala deploy CancelBySignalC7Simulation\n```\n\
    ```bash\n./helper.scala deploy CancelBySignalC8Simulation\n```\n\n## Offene Punkte\n\
    \n- Im gemockten Lauf auf C8 setzt der InitWorker `processInstanceId` nicht (im\
    \ normalen Lauf schon) –\n  die Variablen kommen dort über den Fehler `output-mocked`,\
    \ nicht über das Abschliessen des Jobs.\n\n\n<details>\n<summary><b><i>CHANGELOG.md</i></b></summary>\n\
