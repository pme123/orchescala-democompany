  /process/{processInstanceId}/userTask/ApproveRequestUT/variables:
    get:
      tags:
      - Identity V1
      summary: 'UserTask variables: ApproveRequestUT'
      description: |2-

        Antrag freigeben - wer die Aufgabe erledigt, steht danach als `_identityCorrelationOfActor` im Prozess.

        - _taskDefinitionKey_: `ApproveRequestUT`

        ---




        - Input:  `democompany.patterns.domain.identity.v1.ApproveRequestUT > In`
        - Output: `democompany.patterns.domain.identity.v1.ApproveRequestUT > Out`

        <p/>
        <details>
        <summary><b><i>General Information</i></b></summary>
        <p>

        A <b>UserTask</b> consists of two steps (variables and complete).
        This is the <b>first step</b>:

        1. Wait for the UserTask and get then the Variables.

        The <b>Output</b> are the Variables you want for your UserTask Form.


        </p>
        </details>
      operationId: 'UserTask variables: ApproveRequestUT'
      parameters:
      - name: processInstanceId
        in: path
        description: |+
          The processInstanceId of the Process.

          > This is the result id of the `StartProcess`. And should automatically be set in Postman - see _Postman Instructions_.

        required: true
        schema:
          default: '{{processInstanceId}}'
          type: string
      - name: variableFilter
        in: query
        description: A comma-separated String of variable names. E.g. `name,firstName`
        required: false
        schema:
          type: string
        example: customerName
      - name: timeoutInSec
