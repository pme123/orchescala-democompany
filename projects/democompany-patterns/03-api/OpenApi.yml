          default: '{{processInstanceId}}'
          type: string
      - name: variableFilter
        in: query
        description: A comma-separated String of variable names. E.g. `name,firstName`
        required: false
        schema:
          type: string
        example: processStatus,customerName,inConfig,greetingMessage
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitProcess.Out'
              examples:
                democompany-patterns-initProcessV1:
                  value:
                    processStatus: succeeded
                    customerName: Peter Muster
                    inConfig:
                      greeting: Grüezi
                    greetingMessage: Grüezi Peter Muster
  /worker/democompany-patterns-initProcessV1:
    post:
      tags:
      - Init Process V1
      summary: Init Worker
      description: |2

        <details>
        <summary><b>General Information</b></summary>

        The Init Worker has the following responsibilities:

          - Validates the Process Input (`In`). -> by Orchescala
          - Maps the Configuration to Process Variables (`InConfig`). -> by Orchescala
          - Custom validation the Process Input (`In`, e.g. combining 2 variables). -> Process Specific
          - Initializes the default Variables with `In` as input (see _Process_ description) and `InitIn` as output. -> Process Specific

        The Input is the same as the `In` object of the _Process_.

        `NoInput` means there is no initialization needed.
        </details>
      operationId: Init Worker
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitProcess.In'
            examples:
              democompany-patterns-initProcessV1:
                value:
                  customerName: Peter Muster
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitProcess.InitIn'
              examples:
                InitIn:
                  value:
                    greetingMessage: Grüezi Peter Muster
  /process/democompany-patterns-identityV1/async:
    post:
      tags:
      - Identity V1
      summary: Process start
      description: "\nBeispiel für die Patterns «Identität übernehmen» und «Identitä\
        t zurücksetzen».\nNach der Benutzeraufgabe übernimmt der Prozess die Identitä\
        t der Person, die sie erledigt hat\n(`_identityCorrelation = _identityCorrelationOfActor`,\
        \ die bisherige in `_identityCorrelationBefore`) -\n«Identität zurücksetzen»\
        \ setzt danach wieder die Identität vom Start.\n\n\n---\n\n- **Called Element**:\
        \ `democompany-patterns-identityV1` (to define in the Call Activity)\n\n\n\
        \n---\n\n\n\n\n- Input:  `democompany.patterns.domain.identity.v1.Identity\
        \ > In`\n- Output: `democompany.patterns.domain.identity.v1.Identity > Out`\n\
        \n\n\n\n<div class=\"diagramCanvas\">\n  <div class=\"diagram\" id=\"patterns-identityV1-1365\"\
        >\n    <img onLoad=\"openFromUrl('patterns-identityV1.bpmn', new BpmnJS({\
        \ container: $('#patterns-identityV1-1365'), height: '95%', width: '95%' }));\"\
        \ src=\"data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==\"\
        \ />\n  </div>\n</div>\n\nDownload: [patterns-identityV1.bpmn](diagrams/patterns-identityV1.bpmn)\n\
        \n\n<div>\n  <button onclick=\"downloadSVG('patterns-identityV1-1365')\">Download\
        \ Diagram as SVG</button>\n</div>\n\n\n<details>\n<summary>\n<b><i>General\
        \ Variable(s)</i></b>\n</summary>\n\n<p>\n\n**outputVariables**:\n\nJust take\
        \ the variable you need in your process!\n```json\n...\n\"outputVariables\"\
        : \"processStatus,customerName,approved,checkedUsernames\",\n...\n```\n\n\
        **outputMock**:\n\n```json\n...\n\"outputMock\": {\n  \"processStatus\" :\
        \ \"succeeded\",\n  \"customerName\" : \"Peter Muster\",\n  \"approved\" :\
        \ true,\n  \"checkedUsernames\" : [\n    \"actor\",\n    \"admin\"\n  ]\n\
        },\n...\n```\n\n</p>\n</details>\n</p>\n      \n\n\n**Used in no other Process.**\n\
        \n**Uses no other Processes.**\n<p/>\n<details>\n<summary><b><i>General Information</i></b></summary>\n\
        <p>\n\nThis describes the <b>Input</b> to start the Process with.\n\nBe aware\
        \ that running this request with Postman,\nyou will not get the <b>Output</b>\
        \ but the <i>processInstanceId</i>, as starting a process is asynchronous.\n\
        \nTo get the <b>Output</b> you need to use the `Process variables` request.\n\
        \n</p>\n</details>"
      operationId: Process start
      parameters:
      - name: tenantId
        in: query
        description: If you have a multi tenant setup, you must specify the Tenant
          ID.
        required: false
        schema:
          default: '{{tenantId}}'
          type: string
      - name: businessKey
        in: query
        description: Business Key, be aware that in Camunda 8 this is an additional
          process variable.
        required: false
        schema:
          default: From Test Client
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Identity.In'
            examples:
              democompany-patterns-identityV1:
                value:
                  customerName: Peter Muster
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessInfo'
              example:
                processInstanceId: f150c3f1-13f5-11ec-936e-0242ac1d0007
                businessKey: ORDER-2025-12345
                status: Active
                engineType: C7
