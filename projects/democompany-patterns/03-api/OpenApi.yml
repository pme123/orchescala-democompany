      summary: Process variables
      description: "\nBeispiel für das Pattern «Einmalige Ausführung».\nDer Prozess\
        \ startet über eine Nachricht (Name = Prozess-ID) mit einem `businessKey`.\
        \ Solange er\nläuft, fängt ein nicht unterbrechender Ereignis-Subprozess dieselbe\
        \ Nachricht - ein zweiter Start\nmit demselben `businessKey` landet in der\
        \ laufenden Instanz (`alreadyRunning = true`) statt eine\nzweite zu starten.\n\
        \n\n---\n\n- **Called Element**: `democompany-patterns-uniqueExecutionV1`\
        \ (to define in the Call Activity)\n\n\n\n---\n\n\n\n\n- Input:  `democompany.patterns.domain.uniqueExecution.v1.UniqueExecution\
        \ > In`\n- Output: `democompany.patterns.domain.uniqueExecution.v1.UniqueExecution\
        \ > Out`\n\n\n\n\n\n<details>\n<summary>\n<b><i>General Variable(s)</i></b>\n\
        </summary>\n\n<p>\n\n**outputVariables**:\n\nJust take the variable you need\
        \ in your process!\n```json\n...\n\"outputVariables\": \"processStatus,customerName,alreadyRunning\"\
        ,\n...\n```\n\n**outputMock**:\n\n```json\n...\n\"outputMock\": {\n  \"processStatus\"\
        \ : \"succeeded\",\n  \"customerName\" : \"Peter Muster\",\n  \"alreadyRunning\"\
        \ : false\n},\n...\n```\n\n</p>\n</details>\n</p>\n      <p/>\n<details>\n\
        <summary><b><i>General Information</i></b></summary>\n<p>\n\nThis describes\
        \ the <b>Output</b> of the Process you get. Be aware this does not check if\
        \ the process is finished (TODO).\n\n  \n</p>\n</details>"
      operationId: Process variables
      parameters:
      - name: processInstanceId
        in: path
        description: |+
          The processInstanceId of the Process.

          > This is the result id of the `StartProcess`. And should automatically be set in Postman - see _Postman Instructions_.

        required: true
        schema:
          default: '{{processInstanceId}}'
          type: string
      - name: variableFilter
        in: query
        description: A comma-separated String of variable names. E.g. `name,firstName`
        required: false
        schema:
          type: string
        example: processStatus,customerName,alreadyRunning
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniqueExecution.Out'
              examples:
                democompany-patterns-uniqueExecutionV1:
                  value:
                    processStatus: succeeded
                    customerName: Peter Muster
                    alreadyRunning: false
  /worker/democompany-patterns-uniqueExecutionV1:
    post:
      tags:
      - Unique Execution V1
      summary: Init Worker
      description: |2

        <details>
        <summary><b>General Information</b></summary>

        The Init Worker has the following responsibilities:

          - Validates the Process Input (`In`). -> by Orchescala
          - Maps the Configuration to Process Variables (`InConfig`). -> by Orchescala
          - Custom validation the Process Input (`In`, e.g. combining 2 variables). -> Process Specific
          - Initializes the default Variables with `In` as input (see _Process_ description) and `InitIn` as output. -> Process Specific

        The Input is the same as the `In` object of the _Process_.

        `NoInput` means there is no initialization needed.
        </details>
      operationId: Init Worker
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UniqueExecution.In'
            examples:
              democompany-patterns-uniqueExecutionV1:
                value:
                  customerName: Peter Muster
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniqueExecution.InitIn'
              examples:
                InitIn:
                  value:
                    alreadyRunning: false
  /process/{processInstanceId}/userTask/EditRequestUT/variables:
    get:
      tags:
      - Unique Execution V1
      summary: 'UserTask variables: EditRequestUT'
      description: |2-

        Antrag bearbeiten - solange die Aufgabe offen ist, läuft der Prozess; ein zweiter Start landet hier.

        - _taskDefinitionKey_: `EditRequestUT`

        ---




        - Input:  `democompany.patterns.domain.uniqueExecution.v1.EditRequestUT > In`
        - Output: `orchescala.domain.NoOutput`

        <p/>
        <details>
        <summary><b><i>General Information</i></b></summary>
        <p>

        A <b>UserTask</b> consists of two steps (variables and complete).
        This is the <b>first step</b>:

        1. Wait for the UserTask and get then the Variables.

        The <b>Output</b> are the Variables you want for your UserTask Form.


        </p>
        </details>
      operationId: 'UserTask variables: EditRequestUT'
      parameters:
      - name: processInstanceId
        in: path
        description: |+
          The processInstanceId of the Process.

          > This is the result id of the `StartProcess`. And should automatically be set in Postman - see _Postman Instructions_.

        required: true
        schema:
          default: '{{processInstanceId}}'
          type: string
      - name: variableFilter
        in: query
        description: A comma-separated String of variable names. E.g. `name,firstName`
        required: false
        schema:
          type: string
        example: customerName
      - name: timeoutInSec
        in: query
        description: The maximum number of seconds to wait for the user task to become
          active (0 - 60). If not provided, it will wait 10 seconds.
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
          maximum: 60
        example: 10
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EditRequestUT.In'
              examples:
                EditRequestUT:
                  value:
                    customerName: Peter Muster
  /userTask/EditRequestUT/{userTaskInstanceId}/complete:
    post:
      tags:
      - Unique Execution V1
      summary: 'UserTask complete: EditRequestUT'
      description: |2-

        Antrag bearbeiten - solange die Aufgabe offen ist, läuft der Prozess; ein zweiter Start landet hier.

        - _taskDefinitionKey_: `EditRequestUT`

        ---




        - Input:  `democompany.patterns.domain.uniqueExecution.v1.EditRequestUT > In`
        - Output: `orchescala.domain.NoOutput`

        <p/>
        <details>
        <summary><b><i>General Information</i></b></summary>
        <p>

        A <b>UserTask</b> consists of two steps (variables and complete).
        This is the <b>second step</b>:

        2. Complete the UserTask

        The <b>Input</b> are the Variables you want to set when completing the task.


        </p>
        </details>
      operationId: 'UserTask complete: EditRequestUT'
      parameters:
      - name: userTaskInstanceId
        in: path
        description: User task instance ID (obtained from getUserTaskVariables)
        required: true
        schema:
          type: string
        example: '{{userTaskInstanceId}}'
      responses:
        '200':
          description: ''
  /message/democompany-patterns-uniqueExecutionV1:
    post:
      tags:
      - Unique Execution V1
      summary: 'Message: uniqueExecutionV1'
      description: |2-

        Dieselbe Start-Nachricht ein zweites Mal - mit dem `businessKey` der laufenden Instanz.

        - _messageName_: `democompany-patterns-uniqueExecutionV1`

        ---




        - Input:  `democompany.patterns.domain.uniqueExecution.v1.UniqueExecution > In`
        - Output: `orchescala.domain.NoOutput`

        <p/>
        <details>
        <summary><b><i>General Information</i></b></summary>
        <p>
        Send a Message to the Process.
        Process is waiting at a Message Event, or has the possibility to interact with a Message,
        e.g. in a Boundary Event.

        </p>
        </details>
      operationId: 'Message: uniqueExecutionV1'
      parameters:
      - name: tenantId
        in: query
        description: If you have a multi tenant setup, you must specify the Tenant
          ID.
        required: false
        schema:
          default: '{{tenantId}}'
          type: string
      - name: timeToLiveInSec
        in: query
        description: 'The time in seconds the message is buffered, waiting for correlation.
          The default value is 0 seconds (no buffering). Only supported in C8 - BE
          AWARE that if set, it is fire and forget: Camunda will just try to correlate
          for the configured time.'
        required: false
        schema:
          type: integer
          format: int32
        example: 10
      - name: businessKey
        in: query
        description: Business Key, be aware that in Camunda 8 this is an additional
          process variable.
        required: false
        schema:
          default: From Test Client
          type: string
      - name: processInstanceId
        in: query
        description: Process instance ID to correlate the message to a specific process
          instance.
        required: false
        schema:
          default: '{{processInstanceId}}'
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UniqueExecution.In'
            examples:
              democompany-patterns-uniqueExecutionV1:
                value:
                  customerName: Peter Muster
        required: true
      responses:
        '200':
          description: ''
