  version: 0.1.0-SNAPSHOT
  summary: "\n\nKatalog mit Beispielprozessen für die Orchescala-Patterns - je Pattern\
    \ ein Prozess mit Simulationen für Camunda 7 und Camunda 8.\n\nCreated at 10/30/26,\
    \ 1:24 PM\n\n**See the [Orchescala Documentation](https://pme123.github.io/orchescala/)**\n\
    \n<details>\n<summary><b><i>Postman Instructions</i></b></summary>\n<p>\nYou can\
    \ directly import this OpenApi YAML to [Postman](https://www.postman.com/):\n\
    **[OpenApi.yml](OpenApi.yml)**\n\nOnly thing you need to adjust is in the Collection.\n\
    - **Authorization**: `Bearer Token` with the `{{access_token}}` from the `GetToken`\
    \ request.\n- **Variables**: `tenantId`: `{{bank}}`\n- **Scripts - Pre-Request**:\n\
    \n```javascript\n// Refresh the OAuth token if necessary\nlet tokenDate = new\
    \ Date(2010, 1, 1);\nconst tokenTimestamp = pm.environment.get(\"OAuth_Timestamp\"\
    );\nif (tokenTimestamp) {\n  tokenDate = Date.parse(tokenTimestamp);\n}\nlet expiresInTime\
    \ = pm.environment.get(\"ExpiresInTime\");\nif (!expiresInTime) {\n  expiresInTime\
    \ = 300000; // Set default expiration time to 5 minutes\n}\nif (new Date() - tokenDate\
    \ >= expiresInTime) {\npm.sendRequest(\n{\n  url: `${pm.environment.get(\n   \
    \   \"tokenService\"\n    )}/auth/realms/${pm.environment.get(\n      \"bank\"\
    \n    )}/protocol/openid-connect/token`,\n  method: \"POST\",\n  header: {\n \
    \   \"Content-Type\": \"application/x-www-form-urlencoded\",\n  },\n  body: {\n\
    \    mode: \"urlencoded\",\n    urlencoded: [\n      { key: \"grant_type\", value:\
    \ \"password\" },\n      { key: \"client_id\", value: pm.environment.get(\"clientId\"\
    )},\n      { key: \"client_secret\", value: pm.environment.get(\"clientSecret\"\
    )},\n      { key: \"username\", value: pm.environment.get(\"username\")},\n  \
    \    { key: \"password\", value: pm.environment.get(\"pwd\") },\n      { key:\
    \ \"scope\", value: pm.environment.get(\"scope\") },\n    ],\n  },\n},\n  (_,\
    \ res) => {\n    pm.environment.set(\"access_token\", res.json().access_token);\n\
    \    pm.environment.set(\"OAuth_Timestamp\", new Date());\n    // Set the ExpiresInTime\
    \ variable to the time given in the response if it exists\n    if (res.json().expires_in)\
    \ {\n      expiresInTime = res.json().expires_in * 1000;\n    }\n    pm.environment.set(\"\
    ExpiresInTime\", expiresInTime);\n  });\n}\n  ```\n\n- **Scripts - Post-Response**:\n\
    \n```javascript\n  // Collection-level test script\n  pm.test(\"Auto-set variables\"\
    , function () {\n    const response = pm.response.json();\n\n    // Set processInstanceId\
    \ if present\n    if (response.processInstanceId) {\n        const id = response.processInstanceId;\n\
    \        pm.collectionVariables.set(\"processInstanceId\", id);\n        console.log(\"\
    Set processInstanceId: \" + id);\n    }\n\n    // Set taskId for array responses\n\
    \    if (pm.response.headers.get(\"userTaskId\")) {\n        const id = pm.response.headers.get(\"\
    userTaskId\")\n        pm.collectionVariables.set(\"userTaskInstanceId\", id);\n\
    \        console.log(\"userTaskInstanceId: \" + id)\n\n    }\n\n});\n  ```\n\n\
    </p>\n</details>\n\n\n\n\n# Package Configuration\n**Check all dependency trees\
    \ here: [democompany-patterns](../../dependencies/democompany-patterns.html)**\n\
    \n<details>\n<summary>PROJECT.conf</summary>\n<p>\n\n```\n\n// Project configuration\n\
    \nprojectName: democompany-patterns\nprojectVersion: 0.1.0-SNAPSHOT\nsubProjects:\
    \ [\n  // subProject1\n  // subProject2\n]\ndependencies: [\n  democompany-services\n\
    ]\n\n```\n\n</p>\n</details>\n\n\nKatalog mit Beispielprozessen für die **Orchescala-Patterns**\
    \ – kleine BPMN-Bausteine, die die\nOrch Spec in einen Prozess einfügt und wiedererkennt.\
    \ Je Pattern gibt es einen Beispielprozess\nfür Camunda 7 und Camunda 8 und eine\
    \ Simulation je Engine, die den Baustein auf einer echten Engine\ndurchspielt.\
    \ Später sollen die BPMN auch als Testdaten für die Orch Spec dienen.\n\nBis jetzt:\
    \ **«Init Process»**, **«Identität übernehmen / zurücksetzen»** und\n**«Mocks\
    \ und Identität weitergeben»**.\n\n## Init Process – `democompany-patterns-initProcessV1`\n\
    \n```\nStart ─▶ [Init Process] ─▶ (succeeded)\n              │ output-mocked (Fehler-Boundary)\n\
    \              ▼\n         ⇨ output-mocked (Link-Wurf)\n\n⇨ output-mocked (Link-Ziel)\
    \ ─▶ (output-mocked)\n```\n\nDer erste Schritt des Prozesses ist ein Service-Task\
    \ mit der **Prozess-ID als Topic**. Den Task\nbearbeitet der InitWorker (`InitProcessWorker`):\n\
    \n- er **prüft das In** – ein leerer `customerName` ist ungültig (`validation-failed`),\n\
    - er **setzt die Vorgaben aus dem InConfig** – fehlt `inConfig` im In, steht danach\n\
    \  `inConfig = {\"greeting\": \"Grüezi\"}` im Prozess,\n- er setzt die Variablen\
    \ aus `customInit` (hier `greetingMessage = \"Grüezi Peter Muster\"`),\n- ist\
    \ der Prozess **gemockt** (`_mockedWorkers` enthält die Prozess-ID), liefert er\
    \ die gemockte\n  Ausgabe als Fehler `output-mocked`. Dieser ist in `_handledErrors\
    \ = output-mocked` freigegeben:\n  die Boundary springt über den Link `output-mocked`\
    \ zum Ende mit `processStatus = output-mocked`.\n\n Datei | Inhalt |\n---|---|\n\
    \ [`InitProcess.scala`](01-domain/src/main/scala/democompany/patterns/domain/initProcess/v1/InitProcess.scala)\
    \ | `In`, `InConfig`, `InitIn`, `Out` |\n [`InitProcessWorker.scala`](03-worker/src/main/scala/democompany/patterns/worker/initProcess/v1/InitProcessWorker.scala)\
    \ | InitWorker: Prüfung und `customInit` |\n [`camunda/patterns-initProcessV1.bpmn`](src/main/resources/camunda/patterns-initProcessV1.bpmn)\
    \ | Camunda 7 |\n [`camunda8/patterns-initProcessV1.bpmn`](src/main/resources/camunda8/patterns-initProcessV1.bpmn)\
    \ | Camunda 8 |\n [`InitProcessSimulation.scala`](03-simulation/src/test/scala/democompany/patterns/simulation/InitProcessSimulation.scala)\
    \ | die Szenarien, für beide Engines gleich |\n\nLayout und IDs des Pattern-Blocks\
    \ (`OutputMockedBoundary`, `OutputMockedThrow`,\n`OutputmockedEvent`, `OutputmockedEndEvent`,\
    \ `OutputMockedError`) stammen aus dem Pattern\n`init-process` der Orch Spec.\n\
    \n### Was in Camunda 8 anders ist\n\n | Camunda 7 | Camunda 8 |\n---|---|---|\n\
    \ Topic | `camunda:type=\"external\" camunda:topic=\"<processId>\"` | `zeebe:taskDefinition\
    \ type=\"<processId>\"` |\n `_handledErrors` | `camunda:inputParameter` | `zeebe:input\
    \ source=\"=&quot;output-mocked&quot;\"` |\n `processStatus` am Ende | Execution\
    \ Listener (`execution.setVariable(...)`) | Output-Mapping (`zeebe:output`) |\n\
    \ `processInstanceId` | gibt es in der Engine (`execution.processInstanceId`)\
    \ | setzt der InitWorker als Variable (der `processInstanceKey`) – nur im normalen\
    \ Lauf, siehe unten |\n\nIn Camunda 8 landen die Variablen der gemockten Ausgabe\
    \ (der Fehler `output-mocked`) zuerst im\nScope der Boundary (dort steht `processStatus\
    \ = succeeded` aus dem gemockten `Out`); im Prozess\nsteht danach `processStatus\
    \ = output-mocked` aus dem Output-Mapping des Endes.\n\n## Simulationen\n\nDrei\
    \ Szenarien je Engine:\n\n1. **`InitProcess`** – normaler Lauf: endet mit `processStatus\
    \ = succeeded`, `inConfig` mit den Vorgaben.\n2. **`InitProcess mocked`** – Prozess-Output\
    \ gemockt: endet über den Pfad `output-mocked` mit\n   `processStatus = output-mocked`.\n\
    3. **`InitProcess invalid In`** – `customerName = \" \"`: der InitWorker meldet\n\
    \   `validation-failed: customerName must not be empty.` – nicht freigegeben,\
    \ also ein Incident.\n\nDie Simulation startet den Prozess **ohne Prüfung über\
    \ die Worker-App**\n(`config.validateProcess(false)`): sonst lehnt der Start ein\
    \ ungültiges In schon vor dem Prozess ab,\nund Szenario 3 käme nie zum InitWorker\
    \ in der Engine.\n\n### Engines\n\nBeide über die Firmen-Einstellung:\n\n- **Camunda\
    \ 7**: `CAMUNDA_BASE_URL` (Standard `http://localhost:8080/engine-rest`, Token\
    \ über `SSO_BASE_URL`).\n- **Camunda 8**: ein **lokales c8run ohne Anmeldung**\
    \ – `CAMUNDA_C8_GRPC_URL`\n  (Standard `http://localhost:26500`), `CAMUNDA_C8_REST_URL`\
    \ (Standard `http://localhost:8181`),\n  `CAMUNDA_C8_OPERATE_URL`.\n\nGateway\
    \ und Worker-Apps nutzen die Engines aus `COMPANY_ENGINES` (Standard `C7,C8,Op`).\n\
    \n### Starten\n\n1. Gateway der Firma starten – im Ordner `democompany-orchescala`\
    \ (Port 8887, ein anderer mit\n   `GATEWAY_PORT`):\n   ```bash\n   COMPANY_ENGINES=C7,C8\
    \ sbt gateway/run\n   ```\n2. Worker starten (C7 und C8 in einer App). `WORKER_APP_PORT`,\
    \ wenn 5555 schon belegt ist:\n   ```bash\n   COMPANY_ENGINES=C7,C8 WORKER_APP_PORT=5556\
    \ sbt \"worker/runMain democompany.patterns.worker.WorkerApp\"\n   ```\n3. Deployen\
    \ und simulieren in einem Schritt – über den Gateway:\n   ```bash\n   ./helper.scala\
    \ deploy InitProcessC7Simulation\n   ```\n   ```bash\n   ./helper.scala deploy\
    \ InitProcessC8Simulation\n   ```\n   Der Helper der Firma (`CompanyDeployHelper`)\
    \ macht `sbt publishLocal`, schickt das Manifest\n   `democompany:democompany-patterns:0.1.0-SNAPSHOT`\
    \ an `POST <GATEWAY_URL>/deployment?targetEngine=<C7|C8>`\n   (die Engine aus\
    \ dem Namen der Simulation; der Gateway liest die BPMN aus dem Jar in\n   `~/.ivy2/local`,\
    \ Ordner `camunda` bzw. `camunda8`) und startet danach die Simulation.\n   `GATEWAY_URL`\
    \ (Standard `http://localhost:8887`) für einen anderen Gateway; `GATEWAY_TOKEN`\
    \ ist nur\n   nötig, wenn der Gateway Tokens prüft (`TOKEN_ISSUER`).\n\n## Identitä\
    t übernehmen / zurücksetzen – `democompany-patterns-identityV1`\n\n```\nStart\
    \ ─▶ [Init Process] ─▶ [Antrag freigeben] ─▶ ◯ Identität übernehmen ─▶ [Identitä\
    t prüfen]\n      ─▶ [Antrag abschliessen] ─▶ ◯ Identität zurücksetzen ─▶ [Identitä\
    t prüfen] ─▶ (succeeded)\n```\n\nZwei getrennte Patterns – opt-in wie in C7: nur\
    \ wo das Pattern steht, wechselt die Identität.\n\nDas Gateway setzt `_identityCorrelation`\
    \ nur beim **Start**. Schliesst jemand eine Benutzeraufgabe ab\n(oder sendet eine\
    \ Nachricht mit `processInstanceId`), gibt es dessen signierte Identität als\n\
    **`_identityCorrelationOfActor`** mit – `_identityCorrelation` bleibt. Ob der\
    \ Prozess sie übernimmt,\nentscheidet das BPMN (siehe «Voraussetzung: Orchescala»\
    ).\n\n- **«Identität übernehmen»** – ein leeres Zwischenereignis direkt nach der\
    \ Benutzeraufgabe (oder dem\n  Empfang der Nachricht):\n  `_identityCorrelationBefore\
    \ = _identityCorrelation`, dann\n  `_identityCorrelation = _identityCorrelationOfActor`\
    \ (fehlt sie, bleibt die bisherige).\n- **«Identität zurücksetzen»** – ein leeres\
    \ Zwischenereignis, überall möglich:\n  `_identityCorrelation = _identityCorrelationBefore`.\n\
    \nDie Signatur bindet die Identität an die Prozessinstanz, nicht an den Namen\
    \ der Variable – nach dem\nKopieren prüfen die ServiceWorker sie wie bisher. Welche\
    \ Identität der Prozess gerade hat, zeigt\n**«Identität prüfen»**: ein CustomTask\
    \ nach dem Übernehmen und nach dem Zurücksetzen. Er hängt den\nBenutzernamen dieser\
    \ Identität an `checkedUsernames` an; das BPMN mappt ihn als Input\n`identityUsername`\
    \ (C7 `${_identityCorrelation.prop(\"username\").stringValue()}`, C8\n`=_identityCorrelation.username`).\
    \ Die Signatur prüft ein CustomWorker nicht – das tun nur\nServiceWorker (siehe\
    \ «Mocks und Identität weitergeben»). Ein CustomTask ist er, damit die Orch Spec\n\
    ihn als Worker des Prozesses mit seinem In/Out erkennt.\n\n | Camunda 7 | Camunda\
    \ 8 |\n---|---|---|\n übernehmen | zwei Execution Listener (`start`) mit `execution.setVariable(...)`\
    \ und `execution.getVariableTyped(...)` | Output-Mappings – die Quellen werden\
    \ alle vor dem Setzen gelesen |\n zurücksetzen | ein Execution Listener | ein\
    \ Output-Mapping |\n\n**C8:** die Output-Mappings stehen auf dem leeren Zwischenereignis\
    \ – nicht auf der Benutzeraufgabe\n(mit einem Output-Mapping übernimmt Zeebe dort\
    \ sonst nur noch die gemappten Variablen).\n\n Datei | Inhalt |\n---|---|\n [`Identity.scala`](01-domain/src/main/scala/democompany/patterns/domain/identity/v1/Identity.scala)\
    \ | `In`, `Out` |\n [`ApproveRequestUT.scala`](01-domain/src/main/scala/democompany/patterns/domain/identity/v1/ApproveRequestUT.scala)\
    \ | «Antrag freigeben» – wer sie erledigt, wird übernommen |\n [`CheckIdentity.scala`](01-domain/src/main/scala/democompany/patterns/domain/identity/v1/CheckIdentity.scala)\
    \ | «Identität prüfen» – CustomTask: Benutzername der Identität des Prozesses\
    \ |\n [`CheckIdentityWorker.scala`](03-worker/src/main/scala/democompany/patterns/worker/identity/v1/CheckIdentityWorker.scala)\
    \ | der CustomWorker dazu |\n [`CloseRequestUT.scala`](01-domain/src/main/scala/democompany/patterns/domain/identity/v1/CloseRequestUT.scala)\
    \ | «Antrag abschliessen» – hier hat der Prozess die übernommene Identität |\n\
    \ [`IdentityWorker.scala`](03-worker/src/main/scala/democompany/patterns/worker/identity/v1/IdentityWorker.scala)\
    \ | InitWorker: Prüfung des In |\n [`camunda/patterns-identityV1.bpmn`](src/main/resources/camunda/patterns-identityV1.bpmn)\
    \ | Camunda 7 |\n [`camunda8/patterns-identityV1.bpmn`](src/main/resources/camunda8/patterns-identityV1.bpmn)\
    \ | Camunda 8 |\n [`IdentitySimulation.scala`](03-simulation/src/test/scala/democompany/patterns/simulation/IdentitySimulation.scala)\
    \ | die Szenarien, für beide Engines gleich |\n\n### Simulationen\n\n1. **`Identity\
    \ approved`** – gestartet als `admin`, «Antrag freigeben» erledigt als `actor`\n\
    \   (`.actingAs(testActorIdentityCorrelation)`), «Antrag abschliessen» wieder\
    \ als `admin`.\n   «Identität prüfen» sieht zuerst `actor` (übernommen), dann\
    \ `admin` (zurückgesetzt):\n   `checkedUsernames = [actor, admin]`. Am Ende gibt\
    \ es `_identityCorrelation`,\n   `_identityCorrelationBefore` und `_identityCorrelationOfActor`.\n\
    2. **`Identity mocked`** – endet über `output-mocked`, ohne Benutzeraufgabe.\n\
    3. **`Identity invalid In`** – `customerName = \" \"`: Incident `validation-failed`.\n\
    \n```bash\n./helper.scala deploy IdentityC7Simulation\n```\n```bash\n./helper.scala\
    \ deploy IdentityC8Simulation\n```\n\nMit Prüfungen wie `isEquals` oder `exists`\
    \ vergleicht die Simulation nur diese – nicht das `Out` von\n`example`. Ohne Zurü\
    cksetzen wäre `checkedUsernames = [actor, actor]` – das lässt das Szenario\nscheitern\
    \ (so geprüft).\n\nVor `actingAs` von Hand geprüft (C7 und C8): über ein lokales\
    \ Gateway gestartet als `starter`,\n«Antrag freigeben» erledigt als `approver`:\n\
    \n wann | `_identityCorrelation` |\n---|---|\n bei «Antrag freigeben» | `starter`\
    \ |\n bei «Antrag abschliessen» | `approver` (übernommen) |\n am Ende | `starter`\
    \ (zurückgesetzt) – `_identityCorrelationBefore = starter` |\n\n«Identität prü\
    fen» – damals noch ein ServiceWorker – hat dabei beide Male die Signatur des Gateways\n\
    akzeptiert (`approver`, dann `starter`).\n\n### Voraussetzung: Orchescala\n\n\
    `_identityCorrelationOfActor` setzt das Gateway erst ab dem Orchescala-Branch\n\
    `claude/gateway-actor-identity-b424f0` (0.9.0-SNAPSHOT, noch nicht gemergt). Mit\
    \ einem älteren\nGateway überschreibt der Abschluss einer Aufgabe die Identitä\
    t selbst: C8 immer, C7 nur mit\n`doOverrideImpersonation = true`.\n\nDass `example.exists(...)`\
    \ das Szenario nach dem `val` benennt (`Identity approved`), braucht\nOrchescala\
    \ ab pme123/orchescala#87 (in develop) – vorher hiess es `example`.\n\n`actingAs`\
    \ und die zweite Test-Identität `testActorIdentityCorrelation` gibt es ab dem\n\
    Orchescala-Branch `feat/simulation-second-test-identity` (0.9.0-SNAPSHOT, noch\
    \ nicht gemergt).\n\n## Mocks und Identität weitergeben – `democompany-patterns-propagateMocksV1`\n\
    \n```\nStart ─▶ [Init Process] ─▶ [Teilprozess aufrufen] ─▶ (succeeded)\n    \
    \                              │\n                                  ▼  democompany-patterns-propagateMocksSubV1\n\
    \                    Start ─▶ [Init Process] ─▶ [Kunde laden] ─▶ (succeeded)\n\
    ```\n\nEin Teilprozess (Call Activity) sieht nur die Variablen, die ihm der Aufruf\
    \ mitgibt. Damit Mocks\nund Identität auch dort gelten, gibt die Call Activity\
    \ diese drei weiter:\n\n- **`_servicesMocked`** – die Services im Teilprozess\
    \ sind gemockt,\n- **`_mockedWorkers`** – gemockte Worker, auch der InitWorker\
    \ des Teilprozesses (dessen Prozess-ID),\n- **`_identityCorrelation`** – die signierte\
    \ Identität des Starts.\n\nDazu das In (`customerName`, `clientId`); zurück kommen\
    \ `processStatus` des Teilprozesses als\n`subProcessStatus` und `client`.\n\n\
    **«Kunde laden»** zeigt, dass beides ankommt: der Service `GetClientsClientId`\
    \ aus\n**democompany-services** (Topic `democompany-services-clientsV1-GetClientsClientId`,\
    \ wie in\ndemocompany-cards). Seinen ServiceWorker führt die Worker-App dieses\
    \ Projekts mit\n(`dependencies(democompany.services.worker.WorkerApp)`, die Abhä\
    ngigkeit steht in `PROJECT.conf`).\nGemockt ist er nur, wenn `_servicesMocked`\
    \ im Teilprozess angekommen ist – und vorher prüft er die\nSignatur von `_identityCorrelation`.\
    \ Die Identität ist an die Prozessinstanz des **Starts**\ngebunden; im Teilprozess\
    \ akzeptiert der Worker sie, weil das die Root-Instanz seines Jobs ist.\n\nWeil\
    \ das Topic nicht mit der Prozess-ID beginnt, sieht die Orch Spec den Schritt\
    \ als Service aus dem\nKatalog – nicht als eigenen Worker des Prozesses.\n\n |\
    \ Camunda 7 | Camunda 8 |\n---|---|---|\n Aufruf | `calledElement=\"<processId>\"\
    ` | `zeebe:calledElement processId=\"<processId>\"` mit `propagateAllChildVariables=\"\
    false\"` und `propagateAllParentVariables=\"false\"` |\n hinein | `camunda:in\
    \ source=… target=…` | `zeebe:input` |\n zurück | `camunda:out source=… target=…\
    ` | `zeebe:output` |\n Root-Instanz des Jobs | der Worker liest sie aus der History\
    \ | kommt mit dem Job – über gRPC nicht, dann fragt der Worker die Engine (siehe\
    \ unten) |\n\n Datei | Inhalt |\n---|---|\n [`PropagateMocks.scala`](01-domain/src/main/scala/democompany/patterns/domain/propagateMocks/v1/PropagateMocks.scala)\
    \ | `In`, `Out` des aufrufenden Prozesses |\n [`PropagateMocksSub.scala`](01-domain/src/main/scala/democompany/patterns/domain/propagateMocks/v1/PropagateMocksSub.scala)\
    \ | `In`, `Out` des Teilprozesses |\n [`PropagateMocksWorker.scala`](03-worker/src/main/scala/democompany/patterns/worker/propagateMocks/v1/PropagateMocksWorker.scala)\
    \ | InitWorker: Prüfung des In |\n [`PropagateMocksSubWorker.scala`](03-worker/src/main/scala/democompany/patterns/worker/propagateMocks/v1/PropagateMocksSubWorker.scala)\
    \ | InitWorker des Teilprozesses |\n [`camunda/patterns-propagateMocksV1.bpmn`](src/main/resources/camunda/patterns-propagateMocksV1.bpmn),\
    \ [`camunda/patterns-propagateMocksSubV1.bpmn`](src/main/resources/camunda/patterns-propagateMocksSubV1.bpmn)\
    \ | Camunda 7 |\n [`camunda8/patterns-propagateMocksV1.bpmn`](src/main/resources/camunda8/patterns-propagateMocksV1.bpmn),\
    \ [`camunda8/patterns-propagateMocksSubV1.bpmn`](src/main/resources/camunda8/patterns-propagateMocksSubV1.bpmn)\
    \ | Camunda 8 |\n [`PropagateMocksSimulation.scala`](03-simulation/src/test/scala/democompany/patterns/simulation/PropagateMocksSimulation.scala)\
    \ | die Szenarien, für beide Engines gleich |\n\n### Simulationen\n\n1. **`PropagateMocks\
    \ services mocked`** – `.mockServices`: «Kunde laden» ist im Teilprozess\n   gemockt\
    \ und akzeptiert die Identität des Starts; endet mit `subProcessStatus = succeeded`\
    \ und dem\n   Kunden aus dem Mock (`client`).\n2. **`PropagateMocks sub worker\
    \ mocked`** – zusätzlich `.mockWorker(PropagateMocksSub.processName)`:\n   der\
    \ Teilprozess endet über `output-mocked` (`subProcessStatus = output-mocked`),\
    \ der aufrufende\n   Prozess mit `processStatus = succeeded`.\n3. **`PropagateMocks\
    \ invalid In`** – `customerName = \" \"`: Incident `validation-failed`.\n\n```bash\n\
    ./helper.scala deploy PropagateMocksC7Simulation\n```\n```bash\n./helper.scala\
    \ deploy PropagateMocksC8Simulation\n```\n\n### Voraussetzung: Orchescala (C8)\n\
    \nÜber gRPC liefert der Camunda-Client 8.9 die Root-Instanz eines Jobs nicht mit\n\
    (`rootProcessInstanceKey` ist leer). Ohne sie lehnt der Worker im Teilprozess\
    \ die Identität des\nStarts ab («bound to process instance …, not to the job's\
    \ … (root: -)»). Ab dem Orchescala-Branch\n`fix/c8-root-process-instance` (0.9.0-SNAPSHOT,\
    \ noch nicht gemergt) fragt der C8-Worker die\nRoot-Instanz dann bei der Engine\
    \ nach (`GET /v2/process-instances/{key}`). C7 braucht das nicht.\n\n## Offene\
    \ Punkte\n\n- Im gemockten Lauf auf C8 setzt der InitWorker `processInstanceId`\
    \ nicht (im normalen Lauf schon) –\n  die Variablen kommen dort über den Fehler\
    \ `output-mocked`, nicht über das Abschliessen des Jobs.\n\n\n<details>\n<summary><b><i>CHANGELOG.md</i></b></summary>\n\
    <p>\n\n\nAll notable changes to this project will be documented in this file.\n\
    \n* Types of Changes (L3):\n  * Added: new features\n  * Changed: changes in existing\
    \ functionality\n  * Deprecated: soon-to-be-removed features\n  * Removed: now\
    \ removed features\n  * Fixed: any bug fixes\n  * Security: in case of vulnerabilities\n\
    \n\nThe format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),\n\
    and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n\
    \n\n</p>\n</details>\n\n\n<p/>\n<details>\n<summary>\n<b><i>General Variables</i></b>\n\
    </summary>\n\n<p>\n\n### Mocking\n\n**_servicesMocked**:\n\nMock all the _ServiceWorkers_\
    \ in your process with their default Mock:\n\n- DSL:\n```scala\nprocess(..)\n\
    \  .mockServices\n```\n\n- Json\n```json\n...\n\"_servicesMocked\": true,\n...\n\
    ```\n\n\n**_mockedWorkers**:\n\nMock any Process- and/or ExternalTask-Worker with\
    \ their default Mocks.\nThis is a list of the _Worker topicNames or Process processNames_,\
    \ you want to mock.\nIt is also possible to use a _comma separated_ String,\n\
    like `\"mySubProcess,myOtherSubProcess,myService\"`\n\n_Be aware_: For Sub-Processes,\
    \ this expects an _InitWorker_ where the _topicName_ is equal to the _processName_.\n\
    \n\n- DSL:\n```scala\nprocess(..)\n  .mockedWorkers(\"mySubProcess1\", \"mySubProcess2\"\
    ) // creates a list with SubProcessess\n  .mockedWorker(\"myOtherSubProcess\"\
    ) // adds a SubProcess\n```\n\n- Json\n```json\n...\n\"mockedWorkers\": [\"mySubProcess\"\
    , \"myOtherSubProcess, myService\"],\n...\n```\n\n\n**_outputMock**:\n\nMock the\
    \ Process or ExternalTask (`Out`)\n - You find an example in every _Process_ and\
    \ _ExternalTask_.\n\n\n- DSL:\n```scala\nprocess(..) // or serviceTask(..)/customTask(..)\n\
    \  .mockWith(outputMock)\n```\n\n- Json\n```json\n...\n\"outputMock\": {..},\n\
    ...\n```\n\n\n**_outputServiceMock**:\n\nMock the Inner-Service (`MockedServiceResponse[ServiceOut]`)\n\
    \ - You find an example in every _ServiceTask_.\n\n\n- DSL:\n```scala\nserviceTask(..)\n\
    \  .mockServiceWith(MockedServiceResponse\n     .success200(inOut.defaultServiceOutMock))\n\
    ```\n\n- Json\n```json\n...\n\"outputServiceMock\": {\n  \"respStatus\" : 200,\n\
    \  \"respBody\" : \"Example String Body\",\n  \"respHeaders\" : [\n  ]\n},\n...\n\
    ```\n\n### Mapping\n**_outputVariables**:\n\nYou can filter the Output with a\
    \ list of variable names you are interested in.\nThis list may include all variables\
    \ from the output (`Out`). We included an example for each Process or ExternalTask.\n\
    It is also possible to use a _comma separated_ String,\nlike `\"name,firstName\"\
    `\n\n\n- DSL:\n```scala\nprocess(..) // or serviceTask(..)/customTask(..)\n  .withOutputVariables(\"\
    name\", \"firstName\") // creates a list with outputVariables\n  .withOutputVariable(\"\
    nickname\") // adds a outputVariable\n```\n\n- Json\n```json\n...\n\"_outputVariables\"\
    : [\"name\", \"firstName\"],\n...\n```\n\n\n**_manualOutMapping**:\n\nBy default\
    \ all output Variables (`Out`) are on the Process for _External Tasks_.\nIf the\
    \ filter __outputVariables_ is not enough,\nyou can set this variable - every\
    \ output variable is then local.\n\n_Be aware_ that you must then manually have\
    \ _output mappings_ for each output variable!\n\n\n- DSL:\n```scala\nserviceTask(..)\
    \ // or customTask(..)\n  .manualOutMapping\n```\n\n- Json\n```json\n...\n\"_manualOutMapping\"\
    : true,\n...\n```\n\n### Mocking\n**_handledErrors**:\n\nA list of error codes\
    \ that are handled (`BpmnError`)\nIt is also possible to use a _comma separated_\
    \ String,\nlike `\"validation-failed,404\"`\n\nAt the moment only _ServiceTasks_\
    \ supported.\n\n\n- DSL:\n```scala\nserviceTask(..)\n  .handleErrors(ErrorCodes.`validation-failed`,\
    \ \"404\") // create a list of handledErrors\n  .handleError(\"404\") // add a\
    \ handledError\n```\n\n- Json\n```json\n...\n\"_handledErrors\": [\"validation-failed\"\
    , \"404\"],\n...\n```\n\n\n**_regexHandledErrors**:\n\nYou can further filter\
    \ Handled Errors with a list of Regex expressions that the body error message\
    \ must match.\nIt is also possible to use a _comma separated_ String,\nlike `\"\
    SQL exception,\"errorNr\":\"20000\"\"`\n\nAt the moment only _ServiceTasks_ supported.\n\
    \n\n- DSL:\n```scala\nserviceTask(..)\n  .handleErrorWithRegex(\"SQL exception\"\
    )\n  .handleErrorWithRegex(\"\\\"errorNr\\\":\\\"20000\\\"\")\n```\n\n- Json\n\
    ```json\n...\n\"_regexHandledErrors\": [\"SQL exception\", \"\"errorNr\":\"20000\"\
    \"],\n...\n```\n\n### Authorization\n**_identityCorrelation**:\n\nIdentity correlation\
    \ for binding user identity to the process instance using HMAC-SHA256 signatures.\n\
    This prevents replay attacks and tampering by cryptographically binding the user\
    \ identity to a specific process instance.\nThe correlation is automatically signed\
    \ with the process instance ID when starting a process.\nCompleting a user task\
    \ or sending a message does not change it - see `_identityCorrelationOfActor`.\n\
    Configure the signing key via environment variable `ORCHESCALA_IDENTITY_SIGNING_KEY`\
    \ or in `EngineConfig`.\n\n- DSL:\n```scala\nval identity = IdentityCorrelation(\n\
    \  username = \"alice@example.com\",\n  email = Some(\"alice@example.com\"),\n\
    \  impersonateProcessValue = Some(\"department-123\")\n)\nprocess(..) // or serviceTask(..)/customTask(..)\n\
    \  .withIdentityCorrelation(identity)\n```\n\n- Json\n```json\n...\n\"_identityCorrelation\"\
    : {\n  \"username\": \"alice@example.com\",\n  \"email\": \"alice@example.com\"\
    ,\n  \"impersonateProcessValue\": \"department-123\",\n  \"issuedAt\": 1706371200000,\n\
    \  \"processInstanceId\": \"12345\",\n  \"signature\": \"abc123...\"\n},\n...\n\
    ```\n\n\n**_identityCorrelationOfActor**:\n\nSet by the engine only: the signed\
    \ identity of the person who completed a user task or sent a message\n(only with\
    \ a `processInstanceId` - the signature needs the process instance).\n`_identityCorrelation`\
    \ stays as set at the start - the BPMN decides whether the process takes over\
    \ the actor's identity.\nThe signature is valid for `_identityCorrelation` as\
    \ well, so a worker can verify it after the copy.\n\n- DSL:\n```scala\n// in the\
    \ BPMN, e.g. output mappings of an empty intermediate event right after the user\
    \ task:\n//   _identityCorrelationBefore = _identityCorrelation\n//   _identityCorrelation\
    \       = _identityCorrelationOfActor\n// and to reset:\n//   _identityCorrelation\
    \       = _identityCorrelationBefore\n```\n\n- Json\n```json\n...\n\"_identityCorrelationOfActor\"\
    : {\n  \"username\": \"bob@example.com\",\n  \"issuedAt\": 1706371200000,\n  \"\
    processInstanceId\": \"12345\",\n  \"signature\": \"def456...\"\n},\n...\n```\n\
    \n</p>\n</details>\n<p/>\n        \n\n> Created with:\n> - [orchescala-api v0.9.0-SNAPSHOT](https://github.com/pme123/orchescala)\n\
    > - democompany-orchescala-api 0.1.0-SNAPSHOT\n> - democompany-orchescala-helper\n\
    \n"
paths:
  /process/democompany-patterns-initProcessV1/async:
    post:
      tags:
      - Init Process V1
      summary: Process start
      description: "\nBeispiel für das Pattern «Init Process»: der erste Schritt ist\
        \ ein Service-Task mit der Prozess-ID als Topic.\nDer InitWorker prüft das\
        \ In, setzt die Vorgaben aus dem InConfig und liefert gemockte Ausgaben -\n\
        ist der Prozess gemockt, endet er über den Pfad `output-mocked` mit `processStatus\
        \ = output-mocked`.\n\n\n---\n\n- **Called Element**: `democompany-patterns-initProcessV1`\
        \ (to define in the Call Activity)\n\n\n\n---\n\n\n\n\n- Input:  `democompany.patterns.domain.initProcess.v1.InitProcess\
        \ > In`\n- Output: `democompany.patterns.domain.initProcess.v1.InitProcess\
        \ > Out`\n\n\n\n\n<div class=\"diagramCanvas\">\n  <div class=\"diagram\"\
        \ id=\"patterns-initProcessV1-44895\">\n    <img onLoad=\"openFromUrl('patterns-initProcessV1.bpmn',\
        \ new BpmnJS({ container: $('#patterns-initProcessV1-44895'), height: '95%',\
        \ width: '95%' }));\" src=\"data:image/gif;base64,R0lGODlhAQABAIAAAP///wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==\"\
        \ />\n  </div>\n</div>\n\nDownload: [patterns-initProcessV1.bpmn](diagrams/patterns-initProcessV1.bpmn)\n\
        \n\n<div>\n  <button onclick=\"downloadSVG('patterns-initProcessV1-44895')\"\
        >Download Diagram as SVG</button>\n</div>\n\n\n<details>\n<summary>\n<b><i>General\
        \ Variable(s)</i></b>\n</summary>\n\n<p>\n\n**outputVariables**:\n\nJust take\
        \ the variable you need in your process!\n```json\n...\n\"outputVariables\"\
        : \"processStatus,customerName,inConfig,greetingMessage\",\n...\n```\n\n**outputMock**:\n\
        \n```json\n...\n\"outputMock\": {\n  \"processStatus\" : \"succeeded\",\n\
        \  \"customerName\" : \"Peter Muster\",\n  \"inConfig\" : {\n    \"greeting\"\
        \ : \"Grüezi\"\n  },\n  \"greetingMessage\" : \"Grüezi Peter Muster\"\n},\n\
        ...\n```\n\n</p>\n</details>\n</p>\n      \n\n\n**Used in no other Process.**\n\
        \n**Uses no other Processes.**\n<p/>\n<details>\n<summary><b><i>General Information</i></b></summary>\n\
        <p>\n\nThis describes the <b>Input</b> to start the Process with.\n\nBe aware\
        \ that running this request with Postman,\nyou will not get the <b>Output</b>\
        \ but the <i>processInstanceId</i>, as starting a process is asynchronous.\n\
        \nTo get the <b>Output</b> you need to use the `Process variables` request.\n\
        \n</p>\n</details>"
      operationId: Process start
      parameters:
      - name: tenantId
        in: query
        description: If you have a multi tenant setup, you must specify the Tenant
          ID.
        required: false
        schema:
          default: '{{tenantId}}'
          type: string
      - name: businessKey
        in: query
        description: Business Key, be aware that in Camunda 8 this is an additional
          process variable.
        required: false
        schema:
          default: From Test Client
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitProcess.In'
            examples:
              democompany-patterns-initProcessV1:
                value:
                  customerName: Peter Muster
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessInfo'
              example:
                processInstanceId: f150c3f1-13f5-11ec-936e-0242ac1d0007
                businessKey: ORDER-2025-12345
                status: Active
                engineType: C7
  /process/democompany-patterns-initProcessV1/{processInstanceId}/variables:
    get:
