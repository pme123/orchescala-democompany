        \ />\n  </div>\n</div>\n\nDownload: [patterns-identityV1.bpmn](diagrams/patterns-identityV1.bpmn)\n\
        \n\n<div>\n  <button onclick=\"downloadSVG('patterns-identityV1-99010')\"\
