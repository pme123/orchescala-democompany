name: Deploy Docs Site to GitHub Pages

# Publishes the committed docs site (catalog, APIs, orch-spec, orch-ops) as a demo:
# https://pme123.github.io/orchescala-democompany/
# Nothing is built here - the site is built locally with `./helper.scala prepareDocs`
# and committed in democompany-orchescala/00-docs/site. It is as current as that commit.
on:
  push:
    branches:
      - develop
    paths:
      - democompany-orchescala/00-docs/site/**
      - .github/workflows/deploy-pages.yml
  # run it by hand from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deployment at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./democompany-orchescala/00-docs/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
